<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Diagnostic Workbench Help | LXNDigital</title>

    <meta name="description" content="Help documentation for the LXNDigital Operational Continuity Diagnostic Workbench.">

    <link rel="canonical" href="https://lxndigital.com/support/DiagnosticWorkbench-Help.html">

    <meta property="og:title" content="Diagnostic Workbench Help">
    <meta property="og:url" content="https://lxndigital.com/support/DiagnosticWorkbench-Help.html">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Help documentation for the LXNDigital Operational Continuity Diagnostic Workbench.">

    <link href="../css/styles.css" rel="stylesheet">
    <link href="../css/LXNCustom.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <style>
        body {
            background-color: #001624;
            color: #c7ced2;
        }

        .help-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0 1.5rem;
            background: #001624;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .help-title h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #ffffff !important;
        }

        .help-title p {
            margin: 0;
            color: #c7ced2;
        }

        .help-shell {
            display: flex;
            height: calc(100vh - 70px);
            background: #001624;
        }

        .help-nav {
            width: 320px;
            overflow-y: auto;
            background: #0b2233;
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 1.25rem;
            transition: all 0.25s ease;
        }

        .help-nav.hidden {
            width: 0;
            padding: 0;
            overflow: hidden;
            border-right: none;
        }

        .help-nav h4 {
            color: #ffffff !important;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .toc a {
            display: block;
            color: #c7ced2;
            text-decoration: none;
            padding: 0.35rem 0;
            line-height: 1.35;
            font-size: 0.88rem;
        }

        .toc a:hover {
            color: #07988B;
        }

        .help-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .md-content {
            max-width: 1100px;
            background: #ffffff;
            color: #334155;
            border-radius: 18px;
            padding: 2rem 3rem;
            box-shadow: 0 1px 3px rgba(0,0,0,.14);
        }

        .md-content h1,
        .md-content h2,
        .md-content h3,
        .md-content h4 {
            color: #1e293b !important;
            text-align: left !important;
        }

        .md-content h1 {
        margin-top: 0;
        margin-bottom: 1.25rem;
        font-size: 2rem;
        font-weight: 700;
         }

        .md-content h2 {
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: .5rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .md-content h3 {
            margin-top: 1.65rem;
            margin-bottom: 0.75rem;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .md-content h4 {
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .md-content p,
        .md-content li {
            color: #475569;
            line-height: 1.7;
        }

        .md-content ul,
        .md-content ol {
            margin-bottom: 1rem;
            padding-left: 1.4rem;
        }

        .md-content a {
        color: #07988B;
        }

        .md-content a:hover {
            color: #0bb5a6;
            text-decoration: underline;
        }

        .md-content code {
            background: #f1f5f9;
            color: #334155;
        }

        .md-content pre {
            background: #f8fafc;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .md-content blockquote {
            border-left: 4px solid #07988B;
            padding-left: 1rem;
            color: #c7ced2;
            background: rgba(0,0,0,0.12);
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
            border-radius: 0.35rem;
        }

        .md-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.25rem 0;
            color: #c7ced2;
        }

        .md-content th,
        .md-content td {
            border: 1px solid rgba(255,255,255,0.14);
            padding: 0.65rem;
            vertical-align: top;
        }

        .md-content th {
            background: rgba(0,0,0,0.18);
            color: #ffffff;
        }

        @media (max-width: 900px) {
            .help-shell {
                display: block;
                height: auto;
            }

            .help-nav {
                width: 100%;
                max-height: 260px;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }

            .help-nav.hidden {
                display: none;
            }

            .help-content {
                padding: 1rem;
            }

            .md-content {
                padding: 1.25rem;
            }

            .help-header {
                height: auto;
                min-height: 70px;
                flex-wrap: wrap;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="help-header">
    <div class="help-title">
        <h1>Operational Continuity Diagnostic Workbench</h1>
        <p>Help & User Guide</p>
    </div>

    <button class="btn btn-primary" onclick="toggleContents()">
        Show / Hide Contents
    </button>
</div>

<div class="help-shell">
    <aside id="tocPane" class="help-nav">
        <h4>Contents</h4>
        <div id="toc" class="toc"></div>
    </aside>

    <main class="help-content">
        <div id="content" class="md-content">
            Loading help documentation...
        </div>
    </main>
</div>

<script>
function toggleContents() {
    document.getElementById('tocPane').classList.toggle('hidden');
}

fetch('../assets/resources/DiagnosticWorkbench-help.md')
    .then(response => response.text())
    .then(md => {
        const html = marked.parse(md);
        const clean = DOMPurify.sanitize(html);

        const content = document.getElementById('content');
        content.innerHTML = clean;

        const headings = content.querySelectorAll('h1, h2, h3');
        const toc = document.getElementById('toc');

        headings.forEach((heading, index) => {
            const id = 'section-' + index;
            heading.id = id;

            const a = document.createElement('a');
            a.href = '#' + id;
            a.textContent = heading.textContent;

            if (heading.tagName === 'H2') {
                a.style.paddingLeft = '12px';
            }

            if (heading.tagName === 'H3') {
                a.style.paddingLeft = '24px';
            }

            toc.appendChild(a);
        });
    })
    .catch(err => {
        document.getElementById('content').innerHTML =
            '<p>Unable to load Workbenchhelp.md</p>';
    });
</script>

</body>
</html>
