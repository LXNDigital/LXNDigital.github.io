<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LCS Lifecycle Continuity Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root{
      --fg:#0f172a; --bg:#fff; --muted:#64748b; --grid:#e9ecef; --edge:#9aa0a6;
      --fade:0.3; --node-radius:8; --lane-gap:80; --same-time-step:4;
      --banner-err:#fda29b; --banner-ok:#8de4d8; --panel:#f8fafc; --panel-border:#e2e8f0;
      --lineage:#64748b;
      --lxn-navy:#001624; --lxn-navy-2:#071927; --lxn-teal:#07988b; --lxn-teal-dark:#05756b;
      --lxn-teal-soft:#f0fdfa; --lxn-ink:#0f172a; --lxn-text:#334155;

      /* NEW: layout variables */
      --header-h:58px;
      --ribbon-h:74px; /* updated at runtime */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial,'Noto Sans','Liberation Sans',sans-serif;color:var(--fg);background:var(--bg)}
    header{
      display:grid;grid-template-columns:minmax(280px,1fr) auto;gap:12px;align-items:center;
      padding:8px 12px;border-bottom:1px solid #163545;background:var(--lxn-navy);color:#fff;
      position:sticky;top:0;z-index:10
    }
    #titleBlock{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
    h1{display:flex;align-items:baseline;min-width:0;font-size:15px;margin:0;font-weight:700;white-space:nowrap}
    #seedTag{min-width:0;overflow:hidden;text-overflow:ellipsis;color:#9fb3c0;font-size:11px;margin-left:8px;font-weight:500}
    #controls{display:flex;gap:6px;align-items:center;justify-self:end;white-space:nowrap}
    .btn,.control-menu summary{
      border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;
      padding:5px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;line-height:1.2
    }
    .btn:hover,.control-menu summary:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.36)}
    .btn:focus-visible,.control-menu summary:focus-visible{outline:3px solid rgba(7,152,139,.45);outline-offset:1px}
    #toggleMode{background:var(--lxn-teal);border-color:var(--lxn-teal);font-weight:800}
    #toggleMode:hover{background:var(--lxn-teal-dark);border-color:var(--lxn-teal-dark)}
    .file-control{position:relative;overflow:hidden;font-weight:800}
    .file-control input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .control-menu{position:relative}
    .control-menu summary{list-style:none;user-select:none}
    .control-menu summary::-webkit-details-marker{display:none}
    .control-menu[open] summary{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.42)}
    .control-menu-panel{
      position:absolute;right:0;top:calc(100% + 7px);z-index:30;display:grid;gap:5px;min-width:176px;
      padding:7px;background:#fff;border:1px solid var(--panel-border);border-radius:8px;
      box-shadow:0 16px 36px rgba(15,23,42,.18)
    }
    .control-menu-panel .btn{width:100%;text-align:left;color:var(--lxn-text);background:#fff;border-color:transparent}
    .control-menu-panel .btn:hover{color:var(--lxn-teal-dark);background:var(--lxn-teal-soft);border-color:rgba(7,152,139,.22)}
    #banner{width:100%;padding:0;font-size:11px;display:none;background:transparent;border:none;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #banner.ok{color:var(--banner-ok);display:block}
    #banner.err{color:var(--banner-err);display:block}

    /* KPI strip */
    #kpiBar{
      display:grid;grid-template-columns:1fr;
      gap:6px;align-items:stretch;
      padding:6px 10px;
      border-bottom:1px solid var(--panel-border);
      background:var(--panel);position:sticky;top:var(--header-h);z-index:9;
    }
    .sustainability-summary-row{
      display:grid;grid-template-columns:repeat(5,minmax(92px,1fr)) minmax(310px,2.6fr);gap:6px;align-items:start
    }
    .sustainability-summary-row.has-temperature{
      grid-template-columns:repeat(5,minmax(82px,.8fr)) minmax(280px,2.2fr) minmax(220px,1.4fr)
    }
    .time-summary-row,.lifecycle-insights-row{
      display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px
    }
    .ribbon-section-label{
      min-height:44px;display:flex;align-items:center;padding:5px 8px;border-radius:8px;
      color:var(--lxn-teal-dark);background:var(--lxn-teal-soft);border:1px solid rgba(7,152,139,.28);font-size:10px;font-weight:800;
      letter-spacing:.05em;text-transform:uppercase
    }
    .kpi{
      border:1px solid var(--panel-border); border-radius:8px; background:#fff;
      padding:6px 8px; display:flex; flex-direction:column; justify-content:center; gap:1px;
      min-height:44px;
    }
    .kpi .label{font-size:10px;color:var(--muted);line-height:1.2}
    .kpi .value{font-size:14px;font-weight:800;line-height:1.15;color:var(--lxn-ink);font-variant-numeric:tabular-nums}
    .seed-emissions{position:relative;display:block;padding:0;overflow:visible}
    .seed-emissions-static{display:flex;padding:6px 8px}
    .seed-emissions summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;padding:6px 8px;cursor:pointer;list-style:none}
    .seed-emissions summary::-webkit-details-marker{display:none}
    .seed-emissions summary:hover{background:var(--lxn-teal-soft)}
    .seed-emissions[open]{border-color:rgba(7,152,139,.45);box-shadow:inset 3px 0 0 var(--lxn-teal)}
    .seed-emissions-summary{min-width:0}
    .seed-emissions-summary .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .seed-emissions-total{text-align:right;white-space:nowrap}
    .seed-emissions-total .value{display:block}
    .seed-emissions-total .u{font-size:10px;color:var(--muted);font-weight:500}
    .seed-emissions-toggle{font-size:10px;color:var(--lxn-teal-dark);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
    .seed-emissions-breakdown{
      position:fixed;right:292px;top:calc(var(--header-h) + var(--ribbon-h) + 6px);z-index:25;
      width:min(520px,calc(100vw - 320px));
      padding:9px 10px;background:#fff;border:1px solid var(--panel-border);border-left:3px solid var(--lxn-teal);
      border-radius:8px;box-shadow:0 16px 36px rgba(15,23,42,.16)
    }
    .seed-emissions-breakdown .sub{line-height:1.35}
    #kpiTemp{
      display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 18px;column-gap:8px;align-items:center;
      padding:5px 8px;border:1px solid var(--panel-border);border-radius:8px;background:#fff;min-height:44px;
    }
    #kpiTemp .label{grid-column:1;grid-row:1;font-size:10px;color:var(--muted)}
    #kpiTemp .temperature-value{grid-column:2;grid-row:1;text-align:right;font-size:11px;font-weight:800;color:var(--lxn-ink);white-space:nowrap}
    #kpiTemp svg{grid-column:1/3;grid-row:2;width:100%;height:18px;display:block;color:var(--lxn-teal)}
    .time-summary-row .kpi .sub,.lifecycle-insights-row .kpi .sub{display:none}
    @media (max-width:1200px){
      header{grid-template-columns:minmax(220px,1fr) auto}
      .sustainability-summary-row,.sustainability-summary-row.has-temperature{grid-template-columns:repeat(3,minmax(110px,1fr))}
      .seed-emissions{grid-column:span 2}
      .time-summary-row,.lifecycle-insights-row{grid-template-columns:repeat(3,minmax(110px,1fr))}
      .ribbon-section-label{grid-column:1/-1;min-height:32px}
    }
    @media (max-width:820px){
      header{grid-template-columns:1fr;gap:6px}
      #controls{justify-self:start;flex-wrap:wrap}
      .sustainability-summary-row,.sustainability-summary-row.has-temperature,.time-summary-row,.lifecycle-insights-row{grid-template-columns:repeat(2,minmax(0,1fr))}
      .seed-emissions,#kpiTemp{grid-column:1/-1}
      .seed-emissions-breakdown{right:10px;width:calc(100vw - 20px)}
    }

    /* NEW: main area now uses CSS vars for heights */
    #main{display:grid;grid-template-columns:1fr 280px;gap:0;height:calc(100vh - var(--header-h) - var(--ribbon-h))}
    #stage{position:relative;height:100%;width:100%}
    #legendPane{border-left:1px solid var(--panel-border);background:var(--panel);padding:12px;overflow:auto}
    #legendPane h2{margin:8px 0 10px 0;font-size:12px;font-weight:800;color:var(--lxn-ink);text-transform:uppercase;letter-spacing:.04em}
    #legend{display:flex;flex-direction:column;gap:10px}
    .legend-item{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--lxn-text);line-height:1.25;cursor:pointer;border:1px solid transparent;border-radius:8px;padding:6px}
    .legend-item:hover{background:#fff;border-color:var(--panel-border)}
    .legend-item.active{outline:0;border-color:var(--lxn-teal);box-shadow:inset 3px 0 0 var(--lxn-teal);background:var(--lxn-teal-soft)}
    .legend-swatch{width:14px;height:14px;border:1px solid #cfd3d7;border-radius:3px}
    .legend-key{color:var(--muted);font-size:11px}
    .legend-badge-key{font-size:11px;color:#475569;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:7px 8px;line-height:1.45}

    /* Legend emissions mini-chips */
    .legend-emissions{margin-top:4px; font-size:11px; color:#334155}
    .legend-emissions .row{display:flex; flex-wrap:wrap; gap:6px}
    .legend-chip{display:inline-flex; align-items:center; gap:4px; padding:2px 6px;
      border:1px solid #e2e8f0; border-radius:6px; background:#f8fafc}
    .legend-chip .k{color:#64748b}
    .legend-chip .v{font-variant-numeric:tabular-nums; font-weight:600}
    .legend-chip .u{color:#64748b}

    /* Time-centric mode */
    .node.va circle,
    .node.nva circle,
    .node.unknownva circle{ stroke:#ffffff; stroke-width:2px; }
    .legend-times{margin-top:6px;font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
    .legend-timechip{display:inline-flex;gap:4px;align-items:baseline;padding:2px 6px;border:1px solid var(--panel-border);border-radius:999px;background:#fff}
    .legend-timechip .k{font-weight:600;color:#111}
    .legend-timechip .v{color:#111}
    .legend-timechip .u{color:var(--muted)}
    .kpi .sub{font-size:11px;color:#6b7280;margin-top:2px}
    button.insight-kpi{font:inherit;text-align:left;color:inherit;cursor:pointer;width:100%}
    button.insight-kpi:hover:not(:disabled){border-color:#64748b;background:#f8fafc;transform:translateY(-1px)}
    button.insight-kpi:focus-visible{outline:3px solid #60a5fa;outline-offset:1px}
    button.insight-kpi.active{border-color:#111;box-shadow:0 0 0 1px #111;background:#f8fafc}
    button.insight-kpi:disabled{cursor:default;opacity:.68;background:#f8fafc}
    .time-badge{
      pointer-events:none;
      dominant-baseline:middle;
      text-anchor:middle;
      font-size:12px;
      font-weight:700;
      fill:#111;
      stroke:none;
    }
    .time-badge.hidden{display:none}
    .emissions-badge{
      pointer-events:none;text-anchor:middle;dominant-baseline:middle;
      font-size:9px;font-weight:800;fill:#111;paint-order:stroke;
      stroke:#fff;stroke-width:3px;stroke-linejoin:round;
    }
    .emissions-badge.hidden{display:none}

    svg{
      width:100%;height:100%;display:block;
      background:
        linear-gradient(to right, transparent 0 20px, var(--grid) 20px 21px) repeat-x,
        linear-gradient(to bottom, transparent calc(var(--lane-gap) - 1px), var(--grid) var(--lane-gap)) repeat-y;
      background-size:40px 100%, 100% var(--lane-gap)
    }
    svg.spread-active{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 50%,#ffffff 100%)}
    .axis path,.axis line{stroke:var(--muted)}
    .axis text{fill:var(--muted);font-size:12px}
    .axis.hidden{display:none}
    .time-guides.hidden,.chronology-rails.hidden,.parent-arcs.hidden,.time-callout.hidden{display:none}
    .time-guide line{stroke:#94a3b8;stroke-width:1;stroke-dasharray:2 7;opacity:.42;pointer-events:none}
    .time-guide text{fill:#64748b;font-size:11px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
    .time-flow-label{fill:#64748b;font-size:10px;font-weight:700;letter-spacing:.12em;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
    .chronology-rail{fill:none;stroke:#64748b;stroke-width:1.2;opacity:.55;pointer-events:none}
    .chronology-tick{stroke:#64748b;stroke-width:1;opacity:.45;pointer-events:none}
    .chronology-rail-label{fill:#475569;font-size:9px;font-weight:700;letter-spacing:.03em;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
    .parent-arc{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    .parent-arc-halo{stroke-width:18;opacity:.055}
    .parent-arc-line{stroke-width:1.5;stroke-dasharray:1 7;opacity:.24}
    .parent-arc-label{font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
    .time-callout{pointer-events:none}
    .time-callout line{stroke:#64748b;stroke-width:1;opacity:.6}
    .time-callout rect{fill:#0f172a;stroke:#fff;stroke-width:1.5;rx:8;ry:8;filter:drop-shadow(0 3px 8px #0004)}
    .time-callout text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:middle;stroke:none;paint-order:normal}
    .edge{stroke:var(--edge);color:var(--edge);stroke-width:2;fill:none;opacity:0.9;pointer-events:none}
    .lineage-edge{
      stroke:var(--lineage);
      color:var(--lineage);
      stroke-width:2;
      fill:none;opacity:0.95;
      stroke-dasharray:none;
      pointer-events:none
    }
    .lineage-hidden{display:none !important}
    .node circle{stroke-width:2;cursor:grab;filter:drop-shadow(0 1px 1px #0002)}
    .node text{font-size:12px;dominant-baseline:middle;pointer-events:none;fill:#000;paint-order:stroke;stroke:#fff;stroke-width:3px}
    .node .badge{font-size:11px;font-weight:700;fill:#fff;stroke:none;paint-order:stroke;dominant-baseline:middle;text-anchor:middle}
    .faded{opacity:var(--fade)}
    .active-node circle,
    .node.active-node circle,
    .node.group-selected circle,
    .group-selected circle{stroke:#111 !important;stroke-width:3 !important}
    .active-lineage{stroke-dasharray:0;stroke-width:2.4;opacity:1}
    .node.insight-node circle{stroke:#111 !important;stroke-width:4 !important;filter:drop-shadow(0 0 5px #38bdf8)}
    .edge.insight-edge{stroke:#0f172a;stroke-width:3.5;opacity:1}
    .hidden-shiprecv{display:none}

    .tooltip{
      position:absolute;display:none;min-width:300px;max-width:520px;padding:10px 12px;border-radius:10px;background:#111;color:#fff;
      box-shadow:0 8px 24px #0006;font-size:12px;line-height:1.35;z-index:20;white-space:pre-wrap; pointer-events:none;
    }
    .tooltip h3{margin:0 0 6px 0;font-size:13px;font-weight:600}
    .tooltip .kv{color:#cbd5e1}
    .tooltip code{display:block;white-space:pre-wrap;background:#0b0b0b;border:1px solid #222;border-radius:6px;padding:8px;margin-top:6px;color:#e2e8f0;overflow-x:auto}

    .event-panel{font-size:12px;line-height:1.4;color:#111}
    .event-panel h3{margin:0 0 8px 0;font-size:13px;font-weight:700;color:#111}
    .event-panel .kv{color:#334155;margin-bottom:4px}
    .event-panel code{display:block;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border:1px solid #1e293b;border-radius:8px;padding:8px;margin-top:6px;overflow-x:auto}
    .panel-empty{font-size:12px;color:var(--muted);padding:4px 2px}
  </style>
</head>
<body>
<header>
  <div id="titleBlock">
    <h1>Lifecycle Continuity Explorer <span id="seedTag"></span></h1>
    <div id="banner"></div>
  </div>
  <div id="controls">
    <label class="btn file-control">Open D3<input type="file" id="fileInput" accept=".json,application/json" /></label>
    <button id="toggleMode" class="btn" title="Switch legend and ribbon between sustainability and time views">Mode: Sustainability</button>
    <button id="toggleSpread" class="btn" title="Spread or compact nodes">Spread</button>
    <button id="toggleRibbon" class="btn" title="Show/Hide the KPI ribbon">Hide Ribbon</button>
    <details class="control-menu">
      <summary>View</summary>
      <div class="control-menu-panel">
        <button id="toggleAxis" class="btn" title="Show or hide the timeline">Hide Timeline</button>
        <button id="toggleLineage" class="btn" title="Alternate lineage relationships between dotted and solid">Lineage: Dotted</button>
        <button id="toggleShipRecvPaths" class="btn" title="Hide/Show Ship→Recv paths and cross-parent links">Hide Ship→Recv Paths</button>
        <button id="toggleEventTooltip" class="btn" title="Switch the right-side pane between legend and event data">Show Event Data</button>
      </div>
    </details>
    <details class="control-menu">
      <summary>Layout</summary>
      <div class="control-menu-panel">
        <button id="resetZoom" class="btn" title="Reset zoom/pan">Reset view</button>
        <button id="unpinAll" class="btn" title="Clear all pinned nodes">Unpin all</button>
        <button id="saveLayout" class="btn" title="Save current node layout to a .loc file">Save Layout</button>
        <button id="restoreLayout" class="btn" title="Restore node layout from a .loc file">Restore Layout</button>
      </div>
    </details>
    <input type="file" id="layoutInput" accept=".loc,application/json" style="display:none" />
  </div>
</header>

<!-- KPI STRIP -->
<section id="kpiBar"></section>

<div id="main">
  <div id="stage">
    <svg id="svg">
      <defs>
        <marker id="arrow" viewBox="0 0 12 10" markerUnits="userSpaceOnUse" refX="22" refY="5" markerWidth="8" markerHeight="6" orient="auto">
          <path d="M0,0 L12,5 L0,10 Z" fill="currentColor"></path>
        </marker>
        <marker id="railArrow" viewBox="0 0 10 8" markerUnits="userSpaceOnUse" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="timeGuides" class="time-guides hidden"></g>
        <g id="chronologyRails" class="chronology-rails hidden"></g>
        <g id="parentArcs" class="parent-arcs hidden"></g>
        <g class="axis" id="timeAxis"></g>
        <g id="edges"></g>
        <g id="lineage"></g>
        <g id="nodes"></g>
        <g id="timeCallout" class="time-callout hidden" aria-hidden="true">
          <line></line>
          <rect></rect>
          <text></text>
        </g>
      </g>
    </svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <aside id="legendPane">
    <h2 id="sidePaneTitle">Legend — Ultimate Parent</h2>
    <div id="legend"></div>
  </aside>
</div>

<script>
/* -------------------- Utilities -------------------- */
function fnv1a(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);h>>>=0}return h>>>0}
function hslToHex(h,s,l){const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c)};return "#"+[f(0),f(8),f(4)].map(x=>x.toString(16)).map(s=>s.padStart(2,'0')).join('')}
function shortBizStep(uri){
  if(!uri || typeof uri!=="string") return "";
  const clean=uri.replace(/\/+$/, "");
  const i=Math.max(clean.lastIndexOf(":"), clean.lastIndexOf("/"), clean.lastIndexOf("#"));
  return i>=0 ? clean.slice(i+1) : clean;
}
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pretty(obj){ try{return JSON.stringify(obj,null,2)}catch{return String(obj)} }
function orgKeyFromSGLN(sgln){ if(!sgln||typeof sgln!=='string')return null; const m=sgln.match(/^urn:epc:id:sgln:([0-9]+)\./); return m?`urn:epc:id:sgln:${m[1]}.0.0`:null; }
function hashColorForKey(key){ const h=fnv1a(key)%360; return hslToHex(h,0.55,0.52); }



/* ---------------- Preferred palette (stable, high-contrast) ---------------- */
const PREFERRED_PALETTE = [
  "#2F5597", // blue
  "#FF9300", // orange
  "#70AD47", // green
  "#9D90A0", // purple
  "#B71E42", // red
  "#14B8A6", // teal
  "#ED7D31", // amber
  "#EB91BB", // pink
  "#64748B", // slate
  "#84CC16", // lime
  "#5B9BD5", // light blue
  "#F43F5E", // rose
  "#1D4ED8", // royal blue
  "#D97706", // burnt orange
  "#15803D", // forest green
  "#7C3AED", // violet
  "#BE123C", // crimson
  "#0F766E", // deep teal
  "#C2410C", // rust
  "#A21CAF", // magenta
  "#475569", // blue grey
  "#65A30D", // olive
  "#0284C7", // azure
  "#B45309", // ochre
  "#E11D48"  // raspberry
];

const ORG_COLOR_STORAGE_KEY = "vci_orgColorAlloc_v2";
let orgColorAllocMap = new Map();

function colorIndexForHex(col){
  return PREFERRED_PALETTE.findIndex(x => String(x).toLowerCase() === String(col).toLowerCase());
}

function generateDistinctColor(index){
  const hue = (index * 137.508) % 360;
  const lightness = (index % 2 === 0) ? 0.48 : 0.58;
  return hslToHex(hue, 0.65, lightness);
}

function loadOrgColorAlloc(){
  try{
    const raw = localStorage.getItem(ORG_COLOR_STORAGE_KEY);
    if(!raw) return;
    const obj = JSON.parse(raw);
    if(obj && typeof obj === "object"){
      orgColorAllocMap = new Map(Object.entries(obj));
    }
  }catch(e){ /* ignore */ }
}
function saveOrgColorAlloc(){
  try{
    const obj = Object.fromEntries(orgColorAllocMap.entries());
    localStorage.setItem(ORG_COLOR_STORAGE_KEY, JSON.stringify(obj));
  }catch(e){ /* ignore */ }
}

function allocateColorForOrgKey(orgKey, used){
  const n = PREFERRED_PALETTE.length;
  const start = fnv1a(orgKey) % n;
  const step = 7;
  let idx = start;
  for(let tries=0; tries<n; tries++){
    if(!used.has(idx)){
      used.add(idx);
      return PREFERRED_PALETTE[idx];
    }
    idx = (idx + step) % n;
  }

  let extra = n;
  while(used.has(extra)) extra++;
  used.add(extra);
  return generateDistinctColor(extra);
}

function ensureOrgColors(orgKeys){
  if(!orgKeys || !orgKeys.length) return;
  const used = new Set();
  for(const col of orgColorAllocMap.values()){
    const ix = colorIndexForHex(col);
    if(ix >= 0) used.add(ix);
  }
  for(const k of orgKeys){
    if(!k || typeof k !== "string") continue;
    if(orgColorAllocMap.has(k)) continue;
    const col = allocateColorForOrgKey(k, used);
    orgColorAllocMap.set(k, col);
  }
  saveOrgColorAlloc();
}

function getOrgColor(orgKey){
  if(!orgKey) return "#94a3b8";
  // Respect masterData-provided org colours if present
  if(orgColorByKey && orgColorByKey.has(orgKey)) return orgColorByKey.get(orgKey);
  if(orgColorAllocMap && orgColorAllocMap.has(orgKey)) return orgColorAllocMap.get(orgKey);

  // lazy allocation
  const used = new Set();
  for(const col of orgColorAllocMap.values()){
    const ix = colorIndexForHex(col);
    if(ix >= 0) used.add(ix);
  }
  const col = allocateColorForOrgKey(orgKey, used);
  orgColorAllocMap.set(orgKey, col);
  saveOrgColorAlloc();
  return col;
}

/* Numeric helpers (deterministic formatting) */
function num2(n){ return (typeof n === "number" && isFinite(n)) ? n : 0; }
function fmt2(n){ return (n == null || !isFinite(n)) ? "—" : n.toFixed(2); }
function fmtFixed(n,precision=2){ return (n == null || !isFinite(n)) ? "—" : n.toFixed(precision); }
function additiveDisplayPrecision(values,total,minPrecision=2,maxPrecision=6){
  const numericValues=values.map(value=>num2(value));
  if(total == null || !isFinite(total)) return minPrecision;
  for(let precision=minPrecision;precision<=maxPrecision;precision+=1){
    const scale=10**precision;
    const roundedParts=numericValues.reduce((sum,value)=>sum+Math.round(value*scale),0);
    if(roundedParts===Math.round(total*scale)) return precision;
  }
  return maxPrecision;
}
function formatHoursCompact(hours){
  if(hours == null || !isFinite(hours)) return "—";
  const minutes=Math.round(hours*60);
  if(minutes<60) return `${minutes} min`;
  const whole=Math.floor(minutes/60), remainder=minutes%60;
  return remainder ? `${whole} h ${remainder} min` : `${whole} h`;
}

/* ------------ masterData lookups (legend names & sensor vehicle info) --------- */
function buildOrgLookups(masterData){
  const nameByKey = new Map();
  const colorByKey = new Map();
  if(!masterData || typeof masterData !== "object") return { nameByKey, colorByKey };

  const looksLikeUrn = v => typeof v === "string" && v.startsWith("urn:");
  const pickName = (attrs) => {
    if (!attrs || typeof attrs !== "object") return null;
    const candidates = [
      "urn:epcglobal:cbv:mda#name",
      "urn:epcglobal:cbv:mda:name",
      "urn:epcglobal:cbv:mda#partyName",
      "urn:epcglobal:cbv:mda#siteName",
      "urn:epcglobal:cbv:mda:description",
      "cbv:mda:name",
      "name"
    ];
    for (const k of candidates) {
      const v = attrs[k];
      if (v != null) return Array.isArray(v) ? String(v[0]) : String(v);
    }
    return null;
  };

  if (Array.isArray(masterData.orgs)) {
    for (const o of masterData.orgs) {
      const key = o?.key || (o?.sgln ? orgKeyFromSGLN(o.sgln) : null);
      if (!key) continue;
      if (o?.displayName && !looksLikeUrn(o.displayName)) nameByKey.set(key, String(o.displayName));
      if (o?.color) colorByKey.set(key, String(o.color));
    }
  }

  if (Array.isArray(masterData.raw)) {
    for (const vocab of masterData.raw) {
      if (!String(vocab?.type || "").endsWith(":Location")) continue;
      const key = orgKeyFromSGLN(vocab?.id);
      if (!key) continue;
      const nm = pickName(vocab.attributes);
      if (nm && (!nameByKey.has(key) || looksLikeUrn(nameByKey.get(key)))) nameByKey.set(key, nm);
    }
  }

  const locs = masterData.locations;
  if (Array.isArray(locs)) {
    for (const loc of locs) {
      const key = loc?.orgKey || (loc?.sgln ? orgKeyFromSGLN(loc.sgln) : null);
      if (!key) continue;
      const attrs = loc.attributes || {};
      const nm = pickName(attrs) || loc.name;
      if (nm && (!nameByKey.has(key) || looksLikeUrn(nameByKey.get(key)))) nameByKey.set(key, String(nm));
    }
  } else if (locs && typeof locs === "object") {
    for (const [sgln, rec] of Object.entries(locs)) {
      const key = orgKeyFromSGLN(sgln);
      if (!key) continue;
      const attrs = rec?.attributes || rec;
      const nm = pickName(attrs);
      if (nm && (sgln === key || !nameByKey.has(key) || looksLikeUrn(nameByKey.get(key)))) nameByKey.set(key, String(nm));
    }
  }

  const parties = masterData.parties;
  if (parties && typeof parties === "object" && !Array.isArray(parties)) {
    for (const [pgln, rec] of Object.entries(parties)) {
      const match = String(pgln).match(/^urn:epc:id:pgln:([0-9]+)\./);
      if (!match) continue;
      const key = `urn:epc:id:sgln:${match[1]}.0.0`;
      const nm = pickName(rec?.attributes || rec);
      const currentName = nameByKey.get(key);
      if (nm && (!currentName || looksLikeUrn(currentName) || /^Controlled demo location\b/i.test(currentName))) nameByKey.set(key, String(nm));
    }
  }

  return { nameByKey, colorByKey };
}

let orgNameByKey=new Map(), orgColorByKey=new Map();

/* ---------- Sensor vehicle helpers (label, color from owner, badge) ---------- */
function lookupMasterDataDescription(epc){
  const md = current.masterData || {};
  const assets = getMasterAssets(md);
  const products = md.products || {};
  const rec = (assets && assets[epc]) || (products && products[epc]);
  if (rec && typeof rec === "object"){
    const attrs = rec.attributes || rec;
    const desc = assetDescription(rec) || attrs.description;
    if (desc) return String(desc);
  }
  return null;
}
function findVehicleEpcForNode(d){
  if (!d || typeof d !== "object") return null;
  const lcs = d.lcs || {};
  const ilmd = d.ilmd || {};
  const explicit = [
    lcs.transportVehicle,
    ilmd["lcs:transportVehicle"],
    ilmd["cbvmda:transportVehicle"],
    ilmd["cbvmda:vehicleID"],
    ilmd["cbvmda:vehicle"]
  ];
  for (const v of explicit){
    if (typeof v === "string" && v.startsWith("urn:epc:id:")) return v;
  }
  const assets = getMasterAssets(current.masterData);
  if (typeof d.readPoint === "string" && /:(?:grai|giai):/.test(d.readPoint) && assets?.[d.readPoint]){
    return d.readPoint;
  }
  if (lcs.movementSubjectClassification === "TRANSPORT_ASSET" && Array.isArray(d.epcs) && assets && typeof assets === "object"){
    for (const epc of d.epcs){
      if (/:(?:grai|giai):/.test(epc) && assets[epc]) return epc;
    }
  }
  return null;
}
function orgKeyFromAssetIdentifier(epc){
  const match = String(epc || "").match(/^urn:epc:id:(?:grai|giai):([0-9]+)\./);
  return match ? `urn:epc:id:sgln:${match[1]}.0.0` : null;
}
function vehicleOwnerOrgKey(vehEpc){
  const rec = getMasterAssets(current.masterData)?.[vehEpc];
  const owner = assetOwner(rec);
  if (owner && typeof owner === "string") return orgKeyFromSGLN(owner);
  return orgKeyFromAssetIdentifier(vehEpc);
}
function isSensorVehicleNode(d){
  return shortBizStep(d.bizStep)==="sensor_reporting" && !!findVehicleEpcForNode(d);
}
function labelForNode(d){
  const step = shortBizStep(d.bizStep);
  if (step === "sensor_reporting"){
    const vehEpc = findVehicleEpcForNode(d);
    const desc = vehEpc ? lookupMasterDataDescription(vehEpc) : null;
    return desc ? `sensor_reporting — ${desc}` : "sensor_reporting";
  }
  if (step === "loading" || step === "unloading"){
    const parent = Array.isArray(d.parentIds) ? (d.parentIds[0] || "") : "";
    const vehicle = /:grai:|:giai:/.test(parent);
    const container = /:sscc:/.test(parent);
    if (step === "loading" && vehicle) return "loading · onto vehicle";
    if (step === "loading" && container) return "loading · into container";
    if (step === "unloading" && vehicle) return "unloading · from vehicle";
    if (step === "unloading" && container) return "unloading · from container";
  }
  return step || (d.eventId || "");
}

function nodeOrgKey(d){
  if (isSensorVehicleNode(d)){
    const vehicle = findVehicleEpcForNode(d);
    const owner = vehicle ? vehicleOwnerOrgKey(vehicle) : null;
    if (owner) return owner;
  }
  return orgKeyFromSGLN(d?.bizLocation) || "__nogroup__";
}

/* -------------------- Node color -------------------- */
function colorForNode(d){
  if (isSensorVehicleNode(d)){
    const vehEpc = findVehicleEpcForNode(d);
    const key = vehEpc ? vehicleOwnerOrgKey(vehEpc) : null;
    if (key){
      return getOrgColor(key);
    }
  }
  const key = orgKeyFromSGLN(d.bizLocation);
  if (key){
    return getOrgColor(key);
  }
  return "#94a3b8";
}

/* -------------------- Sorting (canonical) -------------------- */
const bizRank=new Map([
  ["commissioning",0],["packing",1],["shipping",2],["loading",3],
  ["departing",4],["arriving",5],["unloading",6],["receiving",7],
  ["unpacking",8],["transforming",9],["sensor_reporting",5.5]
]);
function sortNodesDeterministically(nodes){
  return nodes.slice().sort((a,b)=>{
    if(Number.isInteger(a.sequenceIndex) && Number.isInteger(b.sequenceIndex) && a.sequenceIndex!==b.sequenceIndex){
      return a.sequenceIndex-b.sequenceIndex;
    }
    const ta=new Date(a.eventTime||a.recordTime||0).getTime();
    const tb=new Date(b.eventTime||b.recordTime||0).getTime();
    if(ta!==tb) return ta-tb;
    const ra=a.recordTime?new Date(a.recordTime).getTime():-Infinity;
    const rb=b.recordTime?new Date(b.recordTime).getTime():-Infinity;
    if(ra!==rb) return ra-rb;
    const ba=bizRank.get(shortBizStep(a.bizStep)) ?? 999;
    const bb=bizRank.get(shortBizStep(b.bizStep)) ?? 999;
    if(ba!==bb) return ba-bb;
    return (a.id||"").localeCompare(b.id||"");
  });
}

/* -------------------- Layout & spread -------------------- */
function baseLayout(nodes,width,height){
  const margin={top:40,right:40,bottom:60,left:40};
  const innerW=width - margin.left - margin.right;
  const innerH=height - margin.top - margin.bottom;

  const times=nodes.map(n=>new Date(n.eventTime).getTime());
  const tMin=d3.min(times), tMax=d3.max(times);
  const pad=(tMax-tMin)*0.04 || 6e5;
  const x=d3.scaleUtc().domain([new Date(tMin-pad), new Date(tMax+pad)]).range([margin.left, margin.left+innerW]);

  const laneKeys=Array.from(new Set(nodes.map(n=>n.lane||"lane0")));
  const yBase=d3.scalePoint().domain(laneKeys).range([margin.top, margin.top+innerH]).padding(0.5);

  const groups=new Map();
  nodes.forEach(n=>{
    const lane=n.lane||"lane0";
    const key=`${lane}|${new Date(n.eventTime).toISOString()}`;
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(n);
  });
  for(const arr of groups.values()){
    arr.sort((a,b)=>(a.sequenceIndex??Number.MAX_SAFE_INTEGER)-(b.sequenceIndex??Number.MAX_SAFE_INTEGER) || (a.eventId||"").localeCompare(b.eventId||""));
    arr.forEach((n,i)=>{ n._sameTimeIndex=i; n._sameTimeCount=arr.length; });
  }

  nodes.forEach(n=>{
    n.x_time=x(new Date(n.eventTime));
    const sameTimeStep=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--same-time-step'))||4;
    const sameTimeOffset=(n._sameTimeIndex-(n._sameTimeCount-1)/2)*sameTimeStep;
    n.x=n.x_time+sameTimeOffset;
    n.y=yBase(n.lane||"lane0");
    n.x_spread=n.x;
    n.y_spread=n.y;
    n._arcSign=0;
    n._labelDx=12;
    n._labelDy=0;
    n._labelAnchor="start";
    delete n.fx; delete n.fy;
  });

  return {x,yBase,margin,width,height};
}
function parentGroupsInDisplayOrder(nodes) {
  const groups = new Map();
  for (const n of nodes) {
    const key = nodeOrgKey(n);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(n);
  }

  const orderedKeys = (Array.isArray(legendOrder) && legendOrder.length)
    ? legendOrder.filter(k => groups.has(k)).concat(Array.from(groups.keys()).filter(k => !legendOrder.includes(k)))
    : Array.from(groups.keys()).sort((a,b)=>{
        const ai = d3.min(groups.get(a), d => Number.isInteger(d.sequenceIndex) ? d.sequenceIndex : Number.MAX_SAFE_INTEGER);
        const bi = d3.min(groups.get(b), d => Number.isInteger(d.sequenceIndex) ? d.sequenceIndex : Number.MAX_SAFE_INTEGER);
        if (ai !== bi) return ai - bi;
        const ax = d3.mean(groups.get(a), d => d.x) ?? 0;
        const bx = d3.mean(groups.get(b), d => d.x) ?? 0;
        return ax - bx || a.localeCompare(b);
      });
  return { groups, orderedKeys };
}

function orderedNodesForArc(nodes){
  return nodes.slice().sort((a,b)=>
    (a.sequenceIndex??Number.MAX_SAFE_INTEGER)-(b.sequenceIndex??Number.MAX_SAFE_INTEGER) ||
    (a.eventTime || "").localeCompare(b.eventTime || "") ||
    (a.eventId || a.id || "").localeCompare(b.eventId || b.id || "")
  );
}

const TRANSPORT_ARC_STEPS=new Set([
  "loading","departing","transporting","arriving","unloading","sensor_reporting","storing","holding"
]);

function arcParentKey(arc){ return arc?.parentKey || arc?.key || "__nogroup__"; }
function nodeIdForLayout(node){ return node?.id || node?.eventId || ""; }

function journeySegmentsForParent(nodes,parentKey){
  const ordered=orderedNodesForArc(nodes);
  if(ordered.length<2 || !Array.isArray(current.links) || !current.links.length){
    return [{key:`${parentKey}::journey:0`,parentKey,nodes:ordered,incomingNodes:[],outgoingNodes:[],connector:false}];
  }
  const ids=new Set(ordered.map(nodeIdForLayout));
  const adjacency=new Map(ordered.map(node=>[nodeIdForLayout(node),new Set()]));
  const incoming=new Map(ordered.map(node=>[nodeIdForLayout(node),[]]));
  const outgoing=new Map(ordered.map(node=>[nodeIdForLayout(node),[]]));
  for(const edge of current.links){
    const source=typeof edge.source==="string"?edge.source:edge.source?.id;
    const target=typeof edge.target==="string"?edge.target:edge.target?.id;
    const sourceInside=ids.has(source),targetInside=ids.has(target);
    if(sourceInside && targetInside){
      adjacency.get(source)?.add(target);
      adjacency.get(target)?.add(source);
    } else if(!sourceInside && targetInside){
      const external=current.byId.get(source);
      if(external) incoming.get(target)?.push(external);
    } else if(sourceInside && !targetInside){
      const external=current.byId.get(target);
      if(external) outgoing.get(source)?.push(external);
    }
  }

  const components=[];
  const visited=new Set();
  for(const node of ordered){
    const start=nodeIdForLayout(node);
    if(visited.has(start)) continue;
    const stack=[start],componentIds=[];
    visited.add(start);
    while(stack.length){
      const id=stack.pop();
      componentIds.push(id);
      for(const neighbor of adjacency.get(id)||[]){
        if(!visited.has(neighbor)){ visited.add(neighbor); stack.push(neighbor); }
      }
    }
    const componentNodes=orderedNodesForArc(componentIds.map(id=>current.byId.get(id)).filter(Boolean));
    const incomingNodes=componentIds.flatMap(id=>incoming.get(id)||[]);
    const outgoingNodes=componentIds.flatMap(id=>outgoing.get(id)||[]);
    components.push({nodes:componentNodes,incomingNodes,outgoingNodes});
  }

  const transportShare=ordered.filter(node=>TRANSPORT_ARC_STEPS.has(shortBizStep(node.bizStep))).length/ordered.length;
  const orgName=String(orgNameByKey.get(parentKey)||"").toLowerCase();
  const namedTransportParent=/(?:3pl|carrier|dhl|freight|logistics|transport|terminal|port)/.test(orgName);
  const anchored=components.filter(component=>component.incomingNodes.length || component.outgoingNodes.length);
  const slotKeys=new Set(anchored.map(component=>{
    const before=Array.from(new Set(component.incomingNodes.map(nodeOrgKey))).sort().join(",");
    const after=Array.from(new Set(component.outgoingNodes.map(nodeOrgKey))).sort().join(",");
    return `${before}->${after}`;
  }));
  const split=components.length>1 && anchored.length>1 && slotKeys.size>1 && (transportShare>=.55 || namedTransportParent);
  const selected=split ? components : [{nodes:ordered,incomingNodes:[],outgoingNodes:[]}];
  return selected
    .sort((left,right)=>(left.nodes[0]?.sequenceIndex??0)-(right.nodes[0]?.sequenceIndex??0))
    .map((component,index)=>({
      key:`${parentKey}::journey:${index}`,
      parentKey,
      nodes:component.nodes,
      incomingNodes:component.incomingNodes,
      outgoingNodes:component.outgoingNodes,
      connector:split,
      segmentIndex:index,
      segmentCount:selected.length
    }));
}

function meanLayoutPoint(nodes,fieldX="x_spread",fieldY="y_spread"){
  const valid=(nodes||[]).filter(Boolean);
  if(!valid.length) return null;
  return {
    x:d3.mean(valid,node=>Number.isFinite(node[fieldX])?node[fieldX]:node.x)??0,
    y:d3.mean(valid,node=>Number.isFinite(node[fieldY])?node[fieldY]:node.y)??0
  };
}

function quadraticPoint(start,control,end,t){
  const u=1-t;
  return {x:u*u*start.x+2*u*t*control.x+t*t*end.x,y:u*u*start.y+2*u*t*control.y+t*t*end.y};
}

function arcApexFromPoints(points){
  if(!points.length) return null;
  if(points.length<3) return points[Math.floor((points.length-1)/2)];
  const first=points[0],last=points.at(-1);
  const dx=last.x-first.x,dy=last.y-first.y;
  const span=Math.hypot(dx,dy)||1;
  return points.reduce((best,point)=>{
    const offset=Math.abs((point.x-first.x)*dy-(point.y-first.y)*dx)/span;
    const bestOffset=Math.abs((best.x-first.x)*dy-(best.y-first.y)*dx)/span;
    return offset>bestOffset?point:best;
  },points[0]);
}

function positionNodesOnParentArc(nodes,key,sign,strength,height,width,margin,parentKey=key){
  const sorted=orderedNodesForArc(nodes);
  if(!sorted.length) return null;
  if(sorted.length===1){
    const node=sorted[0];
    node.x_spread=node.x;
    node.y_spread=node.y;
    node._arcSign=sign;
    node._labelDx=12;
    node._labelDy=0;
    node._labelAnchor="start";
    node._journeySegmentKey=key;
    node._journeySegmentParent=parentKey;
    node._journeyConnector=false;
    return {key,parentKey,connector:false,sign,rotation:sign<0?"clockwise":"anticlockwise",baselineY:node.y,centerX:node.x,centerY:node.y,radius:0,amplitude:0,points:[{x:node.x,y:node.y,node}],xMin:node.x,xMax:node.x,apex:{x:node.x,y:node.y,node}};
  }

  const originalCx=d3.mean(sorted,node=>node.x) ?? width/2;
  const cy=d3.mean(sorted,node=>node.y) ?? height/2;
  const spreadStrength=Math.max(1,strength||1);
  const naturalRadius=12+(sorted.length*10*spreadStrength);
  const verticalRoom=sign<0
    ? Math.max(48,cy-margin.top-34)
    : Math.max(48,height-margin.bottom-34-cy);
  const horizontalRoom=Math.max(90,(width-margin.left-margin.right-48)/2);
  const radius=Math.max(48,Math.min(naturalRadius,verticalRoom,horizontalRoom));
  const cx=Math.max(margin.left+radius+24,Math.min(width-margin.right-radius-24,originalCx));
  const arcPadding=Math.min(Math.PI/10,Math.PI/Math.max(sorted.length+1,3));
  const start=sign<0?Math.PI+arcPadding:arcPadding;
  const end=sign<0?(2*Math.PI)-arcPadding:Math.PI-arcPadding;
  const denom=Math.max(sorted.length-1,1);
  const points=[];

  sorted.forEach((node,index)=>{
    const tBase=index/denom;
    const t=sign<0?tBase:1-tBase;
    const angle=start+(end-start)*t;
    const cos=Math.cos(angle);
    node.x_spread=cx+radius*cos;
    node.y_spread=cy+radius*Math.sin(angle);
    node._arcSign=sign;
    node._labelAnchor="start";
    node._labelDx=12;
    node._labelDy=sign*12;
    node._journeySegmentKey=key;
    node._journeySegmentParent=parentKey;
    node._journeyConnector=false;
    points.push({x:node.x_spread,y:node.y_spread,node,angle});
  });

  const xMin=d3.min(points,point=>point.x)??cx;
  const xMax=d3.max(points,point=>point.x)??cx;
  const apex=points.reduce((best,point)=>Math.abs(point.y-cy)>Math.abs(best.y-cy)?point:best,points[0]);
  return {
    key,parentKey,connector:false,sign,rotation:sign<0?"clockwise":"anticlockwise",baselineY:cy,centerX:cx,centerY:cy,
    radius,amplitude:Math.abs(apex.y-cy),points,xMin,xMax,apex,
    startTime:new Date(sorted[0].eventTime),endTime:new Date(sorted.at(-1).eventTime)
  };
}

function positionNodesOnConnectorArc(segment,strength,height,width,margin,obstacleNodes){
  const sorted=orderedNodesForArc(segment.nodes);
  const fallback=meanLayoutPoint(sorted,"x","y")||{x:width/2,y:height/2};
  let source=meanLayoutPoint(segment.incomingNodes)||{x:Math.max(margin.left,fallback.x-90),y:fallback.y};
  let target=meanLayoutPoint(segment.outgoingNodes)||{x:Math.min(width-margin.right,fallback.x+90),y:fallback.y};
  let dx=target.x-source.x,dy=target.y-source.y;
  let distance=Math.hypot(dx,dy);
  if(distance<80){
    const midpoint={x:(source.x+target.x)/2,y:(source.y+target.y)/2};
    source={x:Math.max(margin.left+18,midpoint.x-90),y:midpoint.y};
    target={x:Math.min(width-margin.right-18,midpoint.x+90),y:midpoint.y};
    dx=target.x-source.x;
    dy=target.y-source.y;
    distance=Math.max(1,Math.hypot(dx,dy));
  }
  const ux=dx/distance,uy=dy/distance;
  const inset=Math.min(54,Math.max(26,distance*.12));
  const start={x:source.x+ux*inset,y:source.y+uy*inset};
  const end={x:target.x-ux*inset,y:target.y-uy*inset};
  const midpoint={x:(start.x+end.x)/2,y:(start.y+end.y)/2};
  const normal={x:-uy,y:ux};
  const bulge=Math.min(92,Math.max(28,18+sorted.length*7*Math.max(1,strength||1)));
  const canvasPenalty=point=>{
    const left=Math.max(0,margin.left+24-point.x);
    const right=Math.max(0,point.x-(width-margin.right-24));
    const top=Math.max(0,margin.top+24-point.y);
    const bottom=Math.max(0,point.y-(height-margin.bottom-24));
    return (left+right+top+bottom)*100;
  };
  const obstaclePenalty=(control,orientation)=>{
    let penalty=canvasPenalty(control);
    const samples=[.25,.5,.75].map(t=>quadraticPoint(start,control,end,t));
    for(const sample of samples){
      for(const node of obstacleNodes||[]){
        const p={x:node.x_spread??node.x,y:node.y_spread??node.y};
        const gap=Math.hypot(sample.x-p.x,sample.y-p.y);
        if(gap<58) penalty+=(58-gap)*(58-gap);
      }
    }
    return penalty+(orientation===((segment.segmentIndex%2)?-1:1)?0:1);
  };
  const candidates=[-1,1].map(orientation=>({
    orientation,
    control:{x:midpoint.x+normal.x*bulge*orientation,y:midpoint.y+normal.y*bulge*orientation}
  }));
  candidates.sort((a,b)=>obstaclePenalty(a.control,a.orientation)-obstaclePenalty(b.control,b.orientation));
  const chosen=candidates[0];
  const sign=chosen.control.y<midpoint.y?-1:1;
  const points=[];
  sorted.forEach((node,index)=>{
    const t=(index+1)/(sorted.length+1);
    const point=quadraticPoint(start,chosen.control,end,t);
    node.x_spread=Math.max(margin.left+18,Math.min(width-margin.right-18,point.x));
    node.y_spread=Math.max(margin.top+18,Math.min(height-margin.bottom-18,point.y));
    node._arcSign=sign;
    node._labelAnchor="start";
    node._labelDx=12;
    node._labelDy=sign*11;
    node._journeySegmentKey=segment.key;
    node._journeySegmentParent=segment.parentKey;
    node._journeyConnector=true;
    points.push({x:node.x_spread,y:node.y_spread,node,t});
  });
  const xMin=d3.min(points,point=>point.x)??midpoint.x;
  const xMax=d3.max(points,point=>point.x)??midpoint.x;
  const apex=arcApexFromPoints(points)||points[0];
  return {
    key:segment.key,parentKey:segment.parentKey,connector:true,segmentIndex:segment.segmentIndex,segmentCount:segment.segmentCount,
    sign,rotation:"journey-direction",baselineY:midpoint.y,centerX:midpoint.x,centerY:midpoint.y,
    radius:Math.hypot(end.x-start.x,end.y-start.y)/2,amplitude:bulge,points,xMin,xMax,apex,
    startTime:new Date(sorted[0].eventTime),endTime:new Date(sorted.at(-1).eventTime)
  };
}

function applyParentArcLayout(nodes,params={strength:1,height:null}){
  const height=params.height||svg.node()?.clientHeight||600;
  const layout=current.layout||{};
  const width=layout.width||svg.node()?.clientWidth||1100;
  const margin=layout.margin||{top:40,right:40,bottom:60,left:40};
  const {groups,orderedKeys}=parentGroupsInDisplayOrder(nodes);
  const arcs=[];
  const connectorSegments=[];
  orderedKeys.forEach((key,index)=>{
    const group=groups.get(key)||[];
    if(!group.length) return;
    const segments=journeySegmentsForParent(group,key);
    if(segments.length>1 && segments.every(segment=>segment.connector)){
      connectorSegments.push(...segments);
      return;
    }
    const sign=index%2===0?-1:1;
    const segment=segments[0];
    const arc=positionNodesOnParentArc(group,segment.key,sign,params.strength||1,height,width,margin,key);
    if(arc) arcs.push(arc);
  });
  const obstacleNodes=nodes.filter(node=>!connectorSegments.some(segment=>segment.nodes.includes(node)));
  connectorSegments.forEach(segment=>{
    const arc=positionNodesOnConnectorArc(segment,params.strength||1,height,width,margin,obstacleNodes);
    if(arc){
      arcs.push(arc);
      obstacleNodes.push(...segment.nodes);
    }
  });
  const byParent=d3.group(arcs,arc=>arcParentKey(arc));
  for(const parentArcs of byParent.values()){
    const labelled=parentArcs.reduce((best,arc)=>{
      if(!best) return arc;
      if(arc.points.length!==best.points.length) return arc.points.length>best.points.length?arc:best;
      return (arc.xMax-arc.xMin)>(best.xMax-best.xMin)?arc:best;
    },null);
    parentArcs.forEach(arc=>{ arc.showLabel=arc===labelled; });
  }
  return arcs;
}

    const Y=spreadMode ? (n.y_spread ?? n.y) : n.y;
    n.fx = n.fx ?? X; n.fy = n.fy ?? Y;
  });
}

function applyRestoredViewState(layoutObj){

function chronologyRailData(){
  if(!spreadMode) return [];
  const raw=(current.parentArcs||[]).filter(arc=>
    arc.points.length>1 && !dirtyChronologyArcs.has(arc.key)
  ).map(arc=>{
    const first=arc.points[0],last=arc.points.at(-1);
    const dx=last.x-first.x,dy=last.y-first.y;
    const span=Math.hypot(dx,dy);
    const normal=span>0?{x:-dy/span,y:dx/span}:{x:0,y:1};
    const midpoint={x:(first.x+last.x)/2,y:(first.y+last.y)/2};
    const apex=arc.apex||midpoint;
    const arcSide=(apex.x-midpoint.x)*normal.x+(apex.y-midpoint.y)*normal.y;
    const labelNormal=arcSide>=0?{x:-normal.x,y:-normal.y}:normal;
    const ticks=[
      {key:"start",t:0,time:new Date(first.node.eventTime)},
      ...(span>=300?[{key:"middle",t:.5,time:new Date((+new Date(first.node.eventTime)+ +new Date(last.node.eventTime))/2)}]:[]),
      {key:"end",t:1,time:new Date(last.node.eventTime)}
    ];
    return {key:arc.key,arc,start:{x:first.x,y:first.y},end:{x:last.x,y:last.y},span,normal,labelNormal,ticks};
  });
  const accepted=[];
  return raw.map(rail=>{
    const offsets=[0,18,36,54,72];
    let placed=null;
    for(const offset of offsets){
      const shift={x:rail.labelNormal.x*offset,y:rail.labelNormal.y*offset};
      const start={x:rail.start.x+shift.x,y:rail.start.y+shift.y};
      const end={x:rail.end.x+shift.x,y:rail.end.y+shift.y};
      const box={
        x1:Math.min(start.x,end.x)-66,x2:Math.max(start.x,end.x)+66,
        y1:Math.min(start.y,end.y)-18,y2:Math.max(start.y,end.y)+18
      };
      const overlaps=accepted.some(other=>!(box.x2<other.x1 || box.x1>other.x2 || box.y2<other.y1 || box.y1>other.y2));
      placed={...rail,start,end,box,offset};
      if(!overlaps) break;
    }
    accepted.push(placed.box);
    placed.ticks=placed.ticks.map(tick=>({
      ...tick,
      x:placed.start.x+(placed.end.x-placed.start.x)*tick.t,
      y:placed.start.y+(placed.end.y-placed.start.y)*tick.t,
      anchor:tick.key==="middle"?"middle":((tick.key==="start")===(placed.end.x>=placed.start.x)?"start":"end")
    }));
    return placed;
  });
}

function arcRecordFromCurrentPositions(groupKey,key,nodes,existing=null,connector=false){
  const points=orderedNodesForArc(nodes).map(node=>{
    const p=getNodeCurrentPos(node);
    return {x:p.x,y:p.y,node};
  });
  const baselineY=existing?.baselineY ?? d3.mean(points,point=>point.y) ?? current.layout?.height/2 ?? 300;
  const centerX=existing?.centerX ?? d3.mean(points,point=>point.x) ?? 0;
  const centerY=existing?.centerY ?? baselineY;
  const xMin=d3.min(points,point=>point.x) ?? centerX;
  const xMax=d3.max(points,point=>point.x) ?? centerX;
  const apex=arcApexFromPoints(points)||points[0];
  const endpointMidY=points.length>1 ? (points[0].y+points.at(-1).y)/2 : baselineY;
  const inferredSign=Math.abs(apex.y-endpointMidY)>2 ? (apex.y<endpointMidY?-1:1) : (d3.mean(points,point=>point.node._arcSign)||-1);
  const sign=existing?.sign ?? inferredSign;
  return {
    key,parentKey:groupKey,connector,showLabel:true,sign,
    rotation:existing?.rotation || (connector?"journey-direction":(sign<0?"clockwise":"anticlockwise")),
    baselineY,centerX,centerY,
    radius:existing?.radius ?? d3.max(points,point=>Math.hypot(point.x-centerX,point.y-centerY)) ?? 0,
    amplitude:Math.abs(apex.y-baselineY),points,xMin,xMax,apex,
    startTime:new Date(points[0].node.eventTime),endTime:new Date(points.at(-1).node.eventTime)
  };
}
function rebuildParentArcsFromCurrentPositions(nodes=current.nodes){
  const {groups,orderedKeys}=parentGroupsInDisplayOrder(nodes||[]);
  const arcs=[];
  orderedKeys.forEach(parentKey=>{
    const group=groups.get(parentKey)||[];
    if(!group.length) return;
    const segments=journeySegmentsForParent(group,parentKey);
    const split=segments.length>1 && segments.every(segment=>segment.connector);
    segments.forEach(segment=>{
      segment.nodes.forEach(node=>{
        node._journeySegmentKey=segment.key;
        node._journeySegmentParent=parentKey;
        node._journeyConnector=split;
      });
      const arc=arcRecordFromCurrentPositions(parentKey,segment.key,segment.nodes,null,split);
      arc.segmentIndex=segment.segmentIndex;
      arc.segmentCount=segment.segmentCount;
      segment.nodes.forEach(node=>{
        node._arcSign=arc.sign;
        node._labelAnchor="start";
        node._labelDx=12;
        node._labelDy=arc.sign*11;
      });
      arcs.push(arc);
    });
  });
  const byParent=d3.group(arcs,arc=>arcParentKey(arc));
  for(const parentArcs of byParent.values()){
    const labelled=parentArcs.reduce((best,arc)=>{
      if(!best) return arc;
      if(arc.points.length!==best.points.length) return arc.points.length>best.points.length?arc:best;
      return (arc.xMax-arc.xMin)>(best.xMax-best.xMin)?arc:best;
    },null);
    parentArcs.forEach(arc=>{ arc.showLabel=arc===labelled; });
  }
  return arcs;
}
function refreshParentArcFromCurrentPositions(groupKey,groupNodes){
  if (!groupKey || !groupNodes.length) return;
  const existingForParent=(current.parentArcs||[]).filter(arc=>arcParentKey(arc)===groupKey);
  const diagonal=(localGroupSpread.get(groupKey)||0)>0;
  let replacements=[];
  if(diagonal){
    replacements=[arcRecordFromCurrentPositions(groupKey,`${groupKey}::selected`,groupNodes,existingForParent[0],false)];
  } else {
    const segmentGroups=d3.group(groupNodes,node=>node._journeySegmentKey||`${groupKey}::journey:0`);
    replacements=Array.from(segmentGroups,([key,segmentNodes])=>{
      const existing=existingForParent.find(arc=>arc.key===key);
      return arcRecordFromCurrentPositions(groupKey,key,segmentNodes,existing,segmentNodes.some(node=>node._journeyConnector));
    });
    const labelled=replacements.reduce((best,arc)=>!best || arc.points.length>best.points.length?arc:best,null);
    replacements.forEach(arc=>{ arc.showLabel=arc===labelled; });
  }
  const others=(current.parentArcs||[]).filter(arc=>arcParentKey(arc)!==groupKey);
  current.parentArcs=others.concat(replacements);
  renderParentArcBackdrops();
  renderChronologyRails();
}
function primaryPathBetween(sourceId,targetId){
  if (!sourceId || !targetId) return {nodeIds:new Set(),edgeKeys:new Set()};
  const adjacency=new Map();
  current.links.forEach(edge=>{
    if (!adjacency.has(edge.source)) adjacency.set(edge.source,[]);
    adjacency.get(edge.source).push(edge.target);
  });
  const queue=[sourceId];
  const previous=new Map([[sourceId,null]]);
  while(queue.length && !previous.has(targetId)){
    const currentId=queue.shift();
    for(const next of adjacency.get(currentId)||[]){
      if(previous.has(next)) continue;
      previous.set(next,currentId);
      queue.push(next);
    }
  }
  const nodeIds=new Set([sourceId,targetId]);
  const edgeKeys=new Set();
  if(previous.has(targetId)){
    let cursor=targetId;
    while(previous.get(cursor)){
      const prior=previous.get(cursor);
      nodeIds.add(prior);
      edgeKeys.add(`${prior}->${cursor}`);
      cursor=prior;
    }
  }
  return {nodeIds,edgeKeys};
}
function lifecycleInsightFocusSets(key){
  const nodeIds=new Set();
  const edgeKeys=new Set();
  const insights=current.lifecycleInsights || {};
  const addPath=(source,target)=>{
    const path=primaryPathBetween(source,target);
    path.nodeIds.forEach(id=>nodeIds.add(id));
    path.edgeKeys.forEach(id=>edgeKeys.add(id));
  };
  if(key === "dwellConcentration"){
    for(const interval of insights.dwellConcentration?.largestContributor?.intervals || []){
      addPath(interval.source,interval.target);
    }
  } else if(key === "handoffLatency"){
    const maximum=insights.handoffLatency?.maximum;
    addPath(maximum?.source,maximum?.target);
  } else if(key === "delayOrigin"){
    const origin=insights.delayOrigin || {};
    addPath(origin.source,origin.target);
  } else if(key === "delayAmplification"){
    for(const segment of insights.delayAmplification?.segmentEvaluations || []){
      if(segment.materialDelay || segment.cumulativeVarianceHours > segment.toleranceHours) addPath(segment.source,segment.target);
    }
  } else if(key === "conditionExposure"){
    for(const excursion of insights.conditionExposure?.excursions || []){
      nodeIds.add(excursion.eventId);
      if(excursion.nextEventId) addPath(excursion.eventId,excursion.nextEventId);
    }
  }
  return {nodeIds,edgeKeys};
}

/* Ship→Recv computations */
function computeShipRecvPathSets(){
  const pathNodeIds = new Set();
  const interiorNodeIds = new Set();
  const pathEdgeKeys = new Set();
  const keyEdge = (u, v) => `${u}->${v}`;

  const adj = new Map();
  current.links.forEach(e => {
    if (!adj.has(e.source)) adj.set(e.source, []);
    adj.get(e.source).push(e.target);
  });

  const shippingNodes = current.nodes.filter(n => shortBizStep(n.bizStep) === "shipping");
  const idToNode = current.byId;

  for (const ship of shippingNodes){
    const q = [ship.id];
    const prev = new Map();
    const seen = new Set([ship.id]);
    let recvId = null;

    while (q.length){
      const u = q.shift();
      const nbrs = adj.get(u) || [];
      for (const v of nbrs){
        if (seen.has(v)) continue;
        seen.add(v);
        prev.set(v, u);
        const vNode = idToNode.get(v);
        if (shortBizStep(vNode?.bizStep) === "receiving"){
          recvId = v; q.length = 0; break;
        }
        q.push(v);
      }
    }

    if (!recvId) continue;

    const path = [];
    let cur = recvId;
    while (cur){
      path.push(cur);
      if (cur === ship.id) break;
      cur = prev.get(cur);
    }
    path.reverse();

    if (path.length <= 1) continue;

    path.forEach(id => pathNodeIds.add(id));
    for (let i = 1; i < path.length - 1; i++){ interiorNodeIds.add(path[i]); }
    for (let i = 0; i < path.length - 1; i++){ pathEdgeKeys.add(keyEdge(path[i], path[i+1])); }
  }

  return { pathNodeIds, interiorNodeIds, pathEdgeKeys };
}
function computeShipRecvHideSets(){
  const { interiorNodeIds, pathEdgeKeys } = computeShipRecvPathSets();
  return { hiddenNodeIds: interiorNodeIds, hiddenEdgeKeys: pathEdgeKeys };
}

  const btn = document.getElementById("toggleShipRecvPaths");

function applyShipRecvHiding(){
  hideShipRecvPaths = shipRecvViewMode === 1;

  if (shipRecvViewMode === 0){
    gNodes.selectAll("g.node").classed("hidden-shiprecv", false);
    gEdges.selectAll("path.edge").classed("hidden-shiprecv", false);
    gLineage.selectAll("path.lineage-edge").classed("hidden-shiprecv", false);
    return;
  }

  const { pathNodeIds, interiorNodeIds, pathEdgeKeys } = computeShipRecvPathSets();
  const isCrossParentEdge = (e) => {
    const u = current.byId.get(e.source);
    const v = current.byId.get(e.target);
    if (!u || !v) return false;
    const ku = orgKeyFromSGLN(u.bizLocation);
    const kv = orgKeyFromSGLN(v.bizLocation);
    return !!ku && !!kv && ku !== kv;
  };

  if (shipRecvViewMode === 1){
    // Existing behaviour: hide everything between shipping and receiving.
    // Also hide any edge connected to a hidden interior node, not just the exact path edges.
    gNodes.selectAll("g.node").classed("hidden-shiprecv", d => interiorNodeIds.has(d.id));
    gEdges.selectAll("path.edge").classed("hidden-shiprecv", d =>
      interiorNodeIds.has(d.source) ||
      interiorNodeIds.has(d.target) ||
      pathEdgeKeys.has(`${d.source}->${d.target}`) ||
      isCrossParentEdge(d)
    );
    gLineage.selectAll("path.lineage-edge").classed("hidden-shiprecv", d =>
      interiorNodeIds.has(d.source) || interiorNodeIds.has(d.target)
    );
    return;
  }

  if (shipRecvViewMode === 2){
    // Corridor-only behaviour: show only shipping→receiving paths, including shipping and receiving endpoints.
    // Hide every edge unless BOTH endpoints are visible and the edge belongs to a detected shipping→receiving path.
    gNodes.selectAll("g.node").classed("hidden-shiprecv", d => !pathNodeIds.has(d.id));
    gEdges.selectAll("path.edge").classed("hidden-shiprecv", d =>
      !pathNodeIds.has(d.source) ||
      !pathNodeIds.has(d.target) ||
      !pathEdgeKeys.has(`${d.source}->${d.target}`)
    );
    gLineage.selectAll("path.lineage-edge").classed("hidden-shiprecv", d =>
      !pathNodeIds.has(d.source) || !pathNodeIds.has(d.target)
    );
  }
}

function isSgln(x){
  return typeof x === 'string'
    && /^urn:epc:id:sgln:[0-9]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(x);
}
function isEpc(x){ return typeof x==='string' && /^urn:epc:(?:id|class):/.test(x); }
function isUriReference(value){
  if(typeof value!=="string") return false;
  const candidate=value.trim();
  if(!candidate || /[\u0000-\u0020<>"{}|\\^`]/.test(candidate) || /%(?![0-9A-Fa-f]{2})/.test(candidate)) return false;
  if(/^[A-Za-z][A-Za-z0-9+.-]*:/.test(candidate)) return true;
  const firstSegment=candidate.split(/[/?#]/,1)[0];
  return !firstSegment.includes(":");
}

function nodeInputs(n){

function validate2_2_15(json){
  const errors=[];
  const isVNext = json?.schemaVersion === "vci-d3-trace-2.0.0";
  const need=["seedEpc","masterData","nodes","links","custodyLinks","indices","lineageLinks","coverage","lifecycleInsights","planningProfile"];
  for(const k of need) if(!(k in json)) errors.push(`Missing top-level '${k}'`);

  if(!Array.isArray(json.nodes)||json.nodes.length<2) errors.push("At least 2 nodes required");
  if(!Array.isArray(json.links)||json.links.length<1) errors.push("At least 1 link required");

if(!json.masterData || typeof json.masterData !== "object") errors.push("masterData must be an object");
  else {
    ["locations","assets","products"].forEach(k => {
      if(!(k in json.masterData)) errors.push(`masterData.${k} missing`);
      else if(typeof json.masterData[k] !== "object" || Array.isArray(json.masterData[k])) errors.push(`masterData.${k} must be a keyed object`);
    });
  }
  if(!json.indices?.xform) errors.push("indices.xform missing");

  for(const n of (json.nodes||[])){
    if(!n.id) errors.push("node.id missing");
    if(!n.eventTime) errors.push(`node.eventTime missing for ${n.id||'?'}`);
    if(Number.isNaN(Date.parse(n.eventTime))) errors.push(`node.eventTime not ISO date for ${n.id}`);
    if(!n.type) errors.push(`node.type missing for ${n.id||'?'}`);
    if(n.bizStep && !/^\w[\w+.-]*:/.test(n.bizStep)) errors.push(`bizStep must be an absolute URI (${n.id})`);
    if(n.disposition && !/^urn:epcglobal:cbv:disp:/.test(n.disposition)) errors.push(`disposition must be a CBV URI (${n.id})`);
    if(n.bizLocation && !isSgln(n.bizLocation)) errors.push(`bizLocation must be an SGLN URN (${n.id})`);
    ["epcs","parentIds","childIds","inputEPCList","outputEPCList"].forEach(f=>{
      if(Array.isArray(n[f]) && !n[f].every(isEpc)) errors.push(`${f} contains non-EPC URNs (${n.id})`);
    });
    if(n.type === "TransformationEvent" && (!Array.isArray(n.inputEPCList) || !Array.isArray(n.outputEPCList))){
      errors.push(`TransformationEvent must use inputEPCList and outputEPCList (${n.id})`);
    }
  }

  const byId=new Map((json.nodes||[]).map(n=>[n.id,n]));
  for(const e of (json.links||[])){
    const u=byId.get(e.source), v=byId.get(e.target);
    if(!u||!v){ errors.push(`link references unknown node: ${e.source}->${e.target}`); continue; }
    if(new Date(u.eventTime)>new Date(v.eventTime)) errors.push(`Back-in-time edge ${u.id} -> ${v.id}`);
    if(Number.isInteger(u.sequenceIndex) && Number.isInteger(v.sequenceIndex) && u.sequenceIndex>=v.sequenceIndex) errors.push(`Non-forward semantic sequence edge ${u.id} -> ${v.id}`);
  }

  for(const ll of (json.lineageLinks||[])){
    if(!ll || (ll.role!=="xform-input" && ll.role!=="xform-output")) errors.push("lineageLinks.role must be 'xform-input' or 'xform-output'");
    if(!isEpc(ll.epc)) errors.push("lineageLinks.epc must be an EPC URN");
    if(!(byId.has(ll.source) && byId.has(ll.target))) errors.push(`lineage link refs unknown node ${ll.source} -> ${ll.target}`);
  }

  if(!(json.indices && json.indices.byEpc)) errors.push("indices.byEpc missing");
  else {
    for(const [epc,arr] of Object.entries(json.indices.byEpc)){
      if(!isEpc(epc) || !Array.isArray(arr) || !arr.every(id=>typeof id==="string")){
        errors.push(`indices.byEpc['${epc}'] must be array of node IDs`); continue;
      }
      for(const id of arr){ if(!byId.has(id)) errors.push(`indices.byEpc['${epc}'] has unknown node ID ${id}`); }
    }
  }

  if(!(json.coverage && Array.isArray(json.coverage.transformations) && json.coverage.unresolved))
    errors.push("coverage must include 'transformations' array and 'unresolved' object");

  /* Optional emissions soft validation */
  if (json.emissions && typeof json.emissions === "object"){
    const e = json.emissions;
    if (e.byOrg && typeof e.byOrg !== "object") errors.push("emissions.byOrg must be an object");
    if (e.byLocation && typeof e.byLocation !== "object") errors.push("emissions.byLocation must be an object");
  }

  if (isVNext){
    if (json.projectionRole !== "non-authoritative-display") errors.push("vNext projectionRole must be 'non-authoritative-display'");
    if (!json.timeEvaluation || typeof json.timeEvaluation !== "object") errors.push("vNext timeEvaluation missing");
    if (!json.lifecycleInsights || json.lifecycleInsights.method !== "seed-lifecycle-diagnostics-v1") errors.push("vNext lifecycleInsights missing or unsupported");
    if (!json.planningProfile || !String(json.planningProfile.file || "").endsWith(".d3.pjson")) errors.push("vNext sibling planning profile binding missing");
    if (!json.emissionsEvaluation || typeof json.emissionsEvaluation !== "object") errors.push("vNext emissionsEvaluation missing");
    for (const n of (json.nodes || [])){
      if (!/^\w[\w+.-]*:/.test(n.eventId || "")) errors.push(`vNext eventId must be a URI (${n.id || "?"})`);
      if (!n.eventTimeZoneOffset) errors.push(`vNext eventTimeZoneOffset missing (${n.id || "?"})`);
      const ee = n.eventEmissions;
      if (!ee) continue;
      if (ee.namespace !== "https://lxndigital.com/ns/emissions/1.0") errors.push(`Unsupported EventEmissions namespace (${n.id})`);
      if (!Array.isArray(ee.records) || !ee.records.length) errors.push(`EventEmissions records missing (${n.id})`);
      if (!isUriReference(ee.sourceOfTruthRef)) errors.push(`EventEmissions sourceOfTruthRef must be a non-empty URI reference (event ${n.id || "?"})`);
      for (const r of (ee.records || [])){
        if (!["checkpoint", "directEmissionsContribution", "purchasedEnergyEmissionsContribution", "logisticsContribution"].includes(r.kind)) errors.push(`Unknown EventEmissions record kind (${n.id})`);
        if (r.unit !== "kgCO2e") errors.push(`EventEmissions unit must be kgCO2e (${n.id})`);
      }
    }
  }

  const allEpcs=new Set(Object.keys(json.indices?.byEpc||{}));
  for(const t of (json.coverage?.transformations||[])){
    if(!t?.eventId || !byId.has(t.eventId)) errors.push(`coverage transformation.eventId not found: ${t?.eventId}`);
    (t.inputs||[]).forEach(i=>{ if(!isEpc(i.epc) || !allEpcs.has(i.epc)) errors.push(`coverage.inputs EPC not indexed: ${i.epc}`); });
    (t.outputs||[]).forEach(o=>{ if(!isEpc(o.epc) || !allEpcs.has(o.epc)) errors.push(`coverage.outputs EPC not indexed: ${o.epc}`); });
  }

  return errors;
}

/* Screen → SVG "world" coords */
function pointerToWorld(nativeEvent){
  const [sx, sy] = d3.pointer(nativeEvent, svg.node());
  const z = d3.zoomTransform(svg.node());
  return [(sx - z.x) / z.k, (sy - z.y) / z.k];
}

function getLocRecord(sgln){
  const L = current.masterData?.locations;
  if (!L || !sgln) return null;
  if (Array.isArray(L)) return L.find(l => l.sgln === sgln) || null;
  if (typeof L === "object" && L[sgln]) {
    const rec = L[sgln];
    return { ...rec, attributes: rec.attributes || rec };
  }
  return null;
}

/* Path drawing */
function bezierPath(u,v){
  const r=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node-radius'))||8;
  const strokeW=2, pad=r+strokeW*0.5;
  const ux=(u.fx??u.x), uy=(u.fy??u.y);
  const vx=(v.fx??v.x), vy=(v.fy??v.y);
  const dx=vx-ux, dy=vy-uy;
  const len=Math.hypot(dx,dy)||1;
  const nx=dx/len, ny=dy/len;
  const sx=ux+nx*pad, sy=uy+ny*pad;
  const ex=vx-nx*pad, ey=vy-ny*pad;
  const t=0.25;
  const c1x=sx+dx*t, c1y=sy+dy*t;
  const c2x=ex-dx*t, c2y=ey-dy*t;
  return `M ${sx},${sy} C ${c1x},${c1y} ${c2x},${c2y} ${ex},${ey}`;
}

/* Emissions parser/merger (v2.2.15 + legacy) */
function parseEmissions(json){
  const byOrg = new Map();
  const unit = (json?.emissions?.unit && typeof json.emissions.unit === "string")
    ? json.emissions.unit
    : "kgCO2e";

  // vNext: display the compiler's seed-specific evaluation. The browser does not
  // recalculate checkpoint replacement, allocation, or double-counting rules.
  const evaluation = json?.emissionsEvaluation;
  if (evaluation && typeof evaluation === "object"){
    const checkpoint = evaluation?.selectedCheckpoint?.allocatedAmountKgCO2e;
    const logistics = evaluation.postCheckpointLogisticsKgCO2e;
    const seedTotals = {
      kind: "vnext",
      checkpoint,
      logistics,
      total: evaluation.totalKgCO2e,
      asOfLastShipping: evaluation.asOfLastShippingKgCO2e ?? checkpoint,
      asOfFinalEvent: evaluation.asOfFinalEventKgCO2e ?? evaluation.totalKgCO2e,
      directEmissions: evaluation.terminalPartyDirectEmissionsKgCO2e,
      purchasedEnergyEmissions: evaluation.terminalPartyPurchasedEnergyEmissionsKgCO2e,
      otherPostCheckpointContributions: evaluation.otherPostCheckpointContributionsKgCO2e,
      terminalParty: evaluation.terminalParty,
      terminalUltimateParent: evaluation.terminalUltimateParent,
      status: evaluation.status,
      reason: evaluation.reason || null,
      boundary: evaluation.boundary || null,
      diagnosticCount: Array.isArray(evaluation.diagnostics) ? evaluation.diagnostics.length : 0
    };
    for (const [orgKey, rec] of Object.entries(evaluation.byUltimateParent || {})) {
      byOrg.set(orgKey, {
        direct_emissions: num2(rec?.directEmissionsKgCO2e),
        purchased_energy_emissions: num2(rec?.purchasedEnergyEmissionsKgCO2e),
        declared_pcf: rec?.latestDeclaredPcfKgCO2e,
        logistics: num2(rec?.logisticsKgCO2e),
        checkpoint_event_id: rec?.checkpointEventId || null
      });
    }
    return { byOrg, unit: evaluation.unit || "kgCO2e", seedTotals, evaluation };
  }

  // legacy byOrg
  const srcOrg = json?.emissions?.byOrg;
  if (srcOrg && typeof srcOrg === "object"){
    for (const [orgKey, rec] of Object.entries(srcOrg)){
      if (typeof orgKey !== "string") continue;
      const s1 = num2(rec?.scope1);
      const s2 = num2(rec?.scope2);
      const s3 = num2(rec?.scope3_declared);
      const tot = (typeof rec?.total === "number" && isFinite(rec.total)) ? rec.total : (s1+s2+s3);
      byOrg.set(orgKey, { scope1:s1, scope2:s2, scope3_declared:s3, scope3_cat1:null, scope3_cat4:null, total:tot });
    }
  }

  // legacy byLocation
  const srcLoc = json?.emissions?.byLocation;
  if (srcLoc && typeof srcLoc === "object"){
    for (const [sgln, rec] of Object.entries(srcLoc)){
      const orgKey = orgKeyFromSGLN(sgln);
      if (!orgKey) continue;
      const s1 = num2(rec?.scope1), s2 = num2(rec?.scope2), s3 = num2(rec?.scope3_declared);
      const add = s1 + s2 + s3;
      if (!byOrg.has(orgKey)) byOrg.set(orgKey, { scope1:0, scope2:0, scope3_declared:0, scope3_cat1:null, scope3_cat4:null, total:0 });
      const cur = byOrg.get(orgKey);
      cur.scope1 += s1; cur.scope2 += s2; cur.scope3_declared += s3; cur.total += add;
    }
  }

  // v2.2.15 orgs[]
  const orgs = json?.emissions?.orgs;
  if (Array.isArray(orgs)){
    for (const o of orgs){
      const key = (typeof o?.orgSglnRoot === "string") ? o.orgSglnRoot : null;
      if (!key) continue;

      const s1 = num2(o?.scope1Total ?? o?.scope1);
      const s2 = num2(o?.scope2Total ?? o?.scope2);
      const s3c1 = num2(o?.scope3Cat1Total ?? o?.scope3Cat1);
      const s3c4 = num2(o?.scope3Cat4Total ?? o?.scope3Cat4);
      const s3other = num2(o?.scope3OtherTotal ?? o?.scope3Other);
      const s3decl = num2(o?.scope3Total) + s3c1 + s3c4 + s3other;
      const tot = num2(o?.total ?? (s1 + s2 + s3decl));

      if (!byOrg.has(key)) byOrg.set(key, { scope1:0, scope2:0, scope3_declared:0, scope3_cat1:0, scope3_cat4:0, total:0 });
      const cur = byOrg.get(key);
      cur.scope1 += s1;
      cur.scope2 += s2;
      cur.scope3_cat1 += s3c1;
      cur.scope3_cat4 += s3c4;
      cur.scope3_declared += s3decl;
      cur.total += tot;

      if (o?.orgName && !orgNameByKey.has(key)) orgNameByKey.set(key, String(o.orgName));
    }
  }

  // seed totals for ribbon
  const seed = json?.emissions?.seedEpcTotals || json?.emissions?.seedTotals;
  let seedTotals = null;
  if (seed && typeof seed === "object"){
    const s1 = num2(seed.scope1 ?? seed.scope1Total);
    const s2 = num2(seed.scope2 ?? seed.scope2Total);
    const s3c1 = num2(seed.scope3Cat1 ?? seed.scope3Cat1Total);
    const s3c4 = num2(seed.scope3Cat4 ?? seed.scope3Cat4Total);
    const total = num2(seed.total ?? (s1 + s2 + s3c1 + s3c4));
    seedTotals = { scope1:s1, scope2:s2, scope3Cat1:s3c1, scope3Cat4:s3c4, total };
  }

  return { byOrg, unit, seedTotals, evaluation: null };
}

/* Legend + mode-aware summaries */
function parseHoursMaybe(v){
  if (v == null) return null;
  if (typeof v === "number" && isFinite(v)) return v;
  if (typeof v !== "string") return null;
  const n = parseFloat(v);
  return isFinite(n) ? n : null;
}
function parseBoolMaybe(v){
  return v === true || v === "true" || v === 1 || v === "1";
}
function classifyNodeTime(d){
  const derived = String(d?.derived?.time?.class || "").trim().toLowerCase();
  if (derived === "va") return "va";
  if (derived === "nva") return "nva";
  if (derived === "unknown") return "unknown";
  const ilmd = d?.ilmd || {};

  const cls = (
    ilmd["lxn:timeClass"] ??
    ilmd["mro:timeClass"] ??
    ilmd["cbvmda:timeClass"] ??
    ilmd["timeClass"] ??
    ilmd["cbvmda:valueAddClass"] ??
    ilmd["valueAddClass"] ??
    ""
  ).toString().trim().toLowerCase();

  if (["va","value_add","valueadded","value-added","value added","value add"].includes(cls)) return "va";
  if (["nva","non_value_add","nonvalueadded","non-value-added","non value added","non value add","non-value-add"].includes(cls)) return "nva";

  if (parseBoolMaybe(ilmd["lxn:valueAdded"]) || parseBoolMaybe(ilmd["valueAdded"])) return "va";
  if (parseBoolMaybe(ilmd["lxn:nonValueAdded"]) || parseBoolMaybe(ilmd["nonValueAdded"])) return "nva";

  const va = parseHoursMaybe(ilmd["cbvmda:valueAddedHours"] ?? ilmd["valueAddedHours"] ?? ilmd["cbvmda:vaHours"] ?? ilmd["vaHours"]);
  const nva = parseHoursMaybe(ilmd["cbvmda:nonValueAddedHours"] ?? ilmd["nonValueAddedHours"] ?? ilmd["cbvmda:nvaHours"] ?? ilmd["nvaHours"]);
  if ((va ?? 0) > 0 && (nva ?? 0) <= 0) return "va";
  if ((nva ?? 0) > 0 && (va ?? 0) <= 0) return "nva";

  return "unknown";
}
function nodeTimeHours(d){
  const ilmd = d?.ilmd || {};
  const va = parseHoursMaybe(ilmd["cbvmda:valueAddedHours"] ?? ilmd["valueAddedHours"] ?? ilmd["cbvmda:vaHours"] ?? ilmd["vaHours"]);
  const nva = parseHoursMaybe(ilmd["cbvmda:nonValueAddedHours"] ?? ilmd["nonValueAddedHours"] ?? ilmd["cbvmda:nvaHours"] ?? ilmd["nvaHours"]);
  return {
    va: va || 0,
    nva: nva || 0,
    total: (va || 0) + (nva || 0),
    explicit: (va != null || nva != null)
  };
}
function computeScenarioTimeTotals(nodes){
  if (current.timeEvaluation && typeof current.timeEvaluation === "object"){
    const t = current.timeEvaluation;
    const classified = num2(t.vaHours) + num2(t.nvaHours);
    return {
      va: num2(t.vaHours),
      nva: num2(t.nvaHours),
      total: num2(t.totalHours),
      pctNva: classified > 0 ? num2(t.nvaHours) / classified * 100 : 0,
      unclassified: num2(t.unclassifiedHours),
      method: t.method
    };
  }
  const sorted = (nodes || []).filter(n => n.eventTime).slice().sort((a,b) => T(a.eventTime) - T(b.eventTime));

  let va = 0, nva = 0, total = 0;
  let usedExplicit = false;

  for (const n of sorted){
    const t = nodeTimeHours(n);
    if (t.explicit){
      va += t.va;
      nva += t.nva;
      total += t.total;
      usedExplicit = true;
    }
  }

  if (!usedExplicit){
    for (let i = 1; i < sorted.length; i++){
      const prev = sorted[i - 1], cur = sorted[i];
      const dtH = (T(cur.eventTime) - T(prev.eventTime)) / 36e5;
      if (!(dtH > 0)) continue;
      total += dtH;
      const cls = classifyNodeTime(cur);
      if (cls === "va") va += dtH;
      else if (cls === "nva") nva += dtH;
    }
  }

  return {
    va: +va.toFixed(2),
    nva: +nva.toFixed(2),
    total: +total.toFixed(2),
    pctNva: total > 0 ? (nva / total) * 100 : 0
  };
}
function buildTimeByOrg(nodes){
  const sorted = (nodes || []).filter(n => n.eventTime).slice().sort((a,b) => T(a.eventTime) - T(b.eventTime));
  const out = new Map();
  let usedExplicit = false;

  for (const n of sorted){
    const key = nodeOrgKey(n);
    if (!key || key === "__nogroup__") continue;
    if (!out.has(key)) out.set(key, { va:0, nva:0, total:0, unknown:0 });

    const cur = out.get(key);
    const t = nodeTimeHours(n);
    if (t.explicit){
      cur.va += t.va;
      cur.nva += t.nva;
      cur.total += t.total;
      usedExplicit = true;
    }
    if (classifyNodeTime(n) === "unknown") cur.unknown += 1;
  }

  if (!usedExplicit){
    for (let i = 1; i < sorted.length; i++){
      const prev = sorted[i - 1], curNode = sorted[i];
      const key = orgKeyFromSGLN(curNode.bizLocation);
      if (!key) continue;
      if (!out.has(key)) out.set(key, { va:0, nva:0, total:0, unknown:0 });
      const dtH = (T(curNode.eventTime) - T(prev.eventTime)) / 36e5;
      if (!(dtH > 0)) continue;
      const agg = out.get(key);
      agg.total += dtH;
      const cls = classifyNodeTime(curNode);
      if (cls === "va") agg.va += dtH;
      else if (cls === "nva") agg.nva += dtH;
    }
  }

  for (const agg of out.values()){
    agg.va = +agg.va.toFixed(2);
    agg.nva = +agg.nva.toFixed(2);
    agg.total = +agg.total.toFixed(2);
  }
  return out;
}

function lifecycleInsightCardsHtml(){

  const largest=dwell.largestContributor || null;

      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(n);
    }

    const median = arr => {
      if (!arr.length) return 0;
      const s = arr.slice().sort((a,b)=>a-b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    };

      .map(([key, groupNodes]) => {

          medianY: median(ys),

          avgY: ys.length ? ys.reduce((a,b)=>a+b,0) / ys.length : 0,
          avgX: xs.length ? xs.reduce((a,b)=>a+b,0) / xs.length : 0
        };
      })
      .sort((a,b) => {
        if (a.medianY !== b.medianY) return a.medianY - b.medianY;
        if (a.medianX !== b.medianX) return a.medianX - b.medianX;
        if (a.avgY !== b.avgY) return a.avgY - b.avgY;
        return a.avgX - b.avgX;

  entries.sort((a,b) => {

          <span class="legend-timechip"><span class="k">VA</span><span class="v">${fmt2(t.va)}</span><span class="u">h</span></span>

function spreadSelectedGroup(groupKey, groupNodes){
  if (!groupKey || !groupNodes.length) return;
  const nextLevel = (localGroupSpread.get(groupKey) || 0) + 1;
  localGroupSpread.set(groupKey, nextLevel);
  saveOriginalPositionsForGroup(groupKey, groupNodes);

  const ordered = orderedNodesForArc(groupNodes);
  const {width=1100,height=650,margin={left:60,right:60,top:40,bottom:60}} = current.layout || {};
  const center = computeGroupCenter(groupNodes);
  const usableWidth = Math.max(180,width-margin.left-margin.right-40);
  const usableHeight = Math.max(120,height-margin.top-margin.bottom-60);
  const stepX = nextLevel === 1 ? 46 : 68;
  const stepY = nextLevel === 1 ? 24 : 34;
  const spanX = Math.min(usableWidth,Math.max(0,(ordered.length-1)*stepX));
  const spanY = Math.min(usableHeight*.72,Math.max(0,(ordered.length-1)*stepY));
  const x0 = Math.max(margin.left+20,Math.min(width-margin.right-20-spanX,center.x-spanX/2));
  const yMin = margin.top+34;
  const yMax = height-margin.bottom-34;
  const yCenter = Math.max(yMin+spanY/2,Math.min(yMax-spanY/2,center.y));

  ordered.forEach((n,index) => {
    const t = ordered.length === 1 ? .5 : index/(ordered.length-1);
    n.fx = x0 + t*spanX;
    n.fy = yCenter + (t-.5)*spanY;
    n._arcSign = t < .5 ? -1 : 1;
    n._labelDx = 12;
    n._labelDy = t < .5 ? -8 : 8;
    n._labelAnchor = "start";
    n._localLayoutMode = "diagonal";
    syncNodeVisualPosition(n);
  });
  refreshParentArcFromCurrentPositions(groupKey,groupNodes);
  hideChronologyRailForGroup(groupKey);
}
