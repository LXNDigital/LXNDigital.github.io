/* ---------- SPEC utilities for KPIs ---------- */
const T = d => new Date(d);
const hours2 = ms => (ms == null || !isFinite(ms)) ? null : +(ms/36e5).toFixed(2);
const endsWithStep = (n, suf) => ((n?.bizStep)||"").endsWith(suf);

function firstTransformForSeed(nodes, seedEpc){
  const transforms = nodes.filter(n => n.type === "TransformationEvent");
  if (!transforms.length) return null;

  const outputsSeed = n => nodeOutputs(n).some(o =>
    (typeof o === "string") ? (o === seedEpc) : (o && o.epc === seedEpc)
  );

  const tfsForSeed = transforms.filter(outputsSeed);
  const pickFrom = (tfsForSeed.length ? tfsForSeed : transforms);
  return pickFrom.sort((a,b)=> T(a.eventTime) - T(b.eventTime))[0];
}

/** Compute KPIs per spec */
function computeKpis_SPEC(){
  const nodes = current.nodes || [];
  const seedEpc = (document.getElementById("seedTag").textContent || "").replace("seedEpc: ","").trim();

  const firstTf = firstTransformForSeed(nodes, seedEpc);

  // 1) Lead: first Transform → last Receiving >= transform
  let leadHours = null;
  if (firstTf){
    const lastRecv = nodes
      .filter(n => endsWithStep(n,"receiving") && T(n.eventTime) >= T(firstTf.eventTime))
      .sort((a,b)=> T(b.eventTime) - T(a.eventTime))[0];
    if (lastRecv){
      leadHours = hours2(T(lastRecv.eventTime) - T(firstTf.eventTime));
    }
  }

  // 2) Transit: Σ departing→arriving after first transform
  let transitHours = null;
  if (firstTf){
    const post = nodes
      .filter(n => T(n.eventTime) >= T(firstTf.eventTime))
      .sort((a,b)=> T(a.eventTime) - T(b.eventTime));

    let sec = 0, pendingDepart = null;
    for (const e of post){
      if (endsWithStep(e,"departing")) pendingDepart = e;
      else if (endsWithStep(e,"arriving") && pendingDepart){
        sec += (T(e.eventTime) - T(pendingDepart.eventTime)) / 1000;
        pendingDepart = null;
      }
    }
    transitHours = +(sec/3600).toFixed(2);
  }

  // 3) Dwell = max(0, lead - transit)
  let dwellHours = null;
  if (leadHours != null && transitHours != null){
    dwellHours = Math.max(0, +(leadHours - transitHours).toFixed(2));
  } else if (leadHours != null){
    dwellHours = leadHours;
  }

  // 4) Handoffs
  const handoffs = nodes.filter(n =>
    n.type === "AssociationEvent" &&
    (endsWithStep(n,"loading") || endsWithStep(n,"unloading"))
  ).length;

  // 5) Sensor pings
  const sensorPings = nodes.filter(n => endsWithStep(n,"sensor_reporting")).length;

  return { leadHours, transitHours, dwellHours, handoffs, sensorPings };
}

/* Temperature strip */
function getTempPoints(){
  return (current.nodes||[]).flatMap(n => {
      const projected=(n.sensorReadings || []).filter(item=>item.measure === "Temperature" && item.uom === "CEL")
        .map(item=>({t:new Date(item.time || n.eventTime),y:Number(item.value)}));
      if(projected.length) return projected.filter(item=>isFinite(item.y));
      const ilmd = n.ilmd || {};
      const v = ilmd["cbvmda:productTempC"];
      const c = (Array.isArray(v) ? v[0] : (v && typeof v==="object" ? v.value : v));
      return (typeof c === "number" && isFinite(c)) ? [{ t:new Date(n.eventTime), y:c }] : [];
    })
    .sort((a,b)=>a.t-b.t);
}
function renderTempStrip(){
  const element=document.getElementById("tempStrip");
  if(!element) return;
  const svg = d3.select(element);
  svg.selectAll("*").remove(); // clear
  const w = element.clientWidth || 600;
  const h = element.clientHeight || 26;
  const pts = getTempPoints();
  if (!pts.length) return;
  const x = d3.scaleTime().domain(d3.extent(pts, d=>d.t)).range([0, w]);
  const y = d3.scaleLinear().domain(d3.extent(pts, d=>d.y)).nice().range([h-2, 2]);
  const line = d3.line().x(d=>x(d.t)).y(d=>y(d.y));
  svg.append("path")
    .datum(pts)
    .attr("fill","none")
    .attr("stroke","currentColor")
    .attr("stroke-width",1.5)
    .attr("d", line);
  svg.selectAll("circle")
    .data(pts).enter().append("circle")
    .attr("cx", d=>x(d.t)).attr("cy", d=>y(d.y)).attr("r", 2).attr("fill","currentColor");
}

/* Seed emissions KPI renderer */
function renderSeedEmissionsKpi(){
  const card = document.getElementById("kpiSeedEmissions");
  const row  = document.getElementById("kpiSeedEmissionsRow");
  if (!card || !row) return;

  if (!emissionsSeedTotals){
    card.style.display = "none";
    return;
  }
  card.style.display = "";

  const u = esc(emissionsUnit);
  const chips = [
    { k: "S1",   v: emissionsSeedTotals.scope1 },
    { k: "S2",   v: emissionsSeedTotals.scope2 },
    { k: "CU.1", v: emissionsSeedTotals.scope3Cat1 },
    { k: "CU.4", v: emissionsSeedTotals.scope3Cat4 },
    { k: "Total", v: (emissionsSeedTotals.total ?? (num2(emissionsSeedTotals.scope1) + num2(emissionsSeedTotals.scope2) + num2(emissionsSeedTotals.scope3Cat1) + num2(emissionsSeedTotals.scope3Cat4))) }
  ];

  row.innerHTML = chips.map(c => `
    <span class="legend-chip">
      <span class="k">${c.k}</span>
      <span class="v">${fmt2(c.v)}</span>${c.k==="Total" ? `<span class="u">${u}</span>`:""}
    </span>`).join("");
}

/* Render */
function render(data){
  clearBanner();
  activeInsightKey=null;
  seedTag.text(data.seedEpc ? `seedEpc: ${data.seedEpc}` : "");
  const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
  const layoutTransition = animateNextLayout && !reduceMotion
    ? d3.transition("layout").duration(720).ease(d3.easeCubicInOut)
    : null;
  animateNextLayout=false;

  const errs=validate2_2_15(data);

  const md = data.masterData ?? current.masterData ?? {};
  current.masterData = md;
  ({nameByKey:orgNameByKey, colorByKey:orgColorByKey} = buildOrgLookups(md));

  const nodes = sortNodesDeterministically(data.nodes);
  const byId = new Map(nodes.map(n=>[n.id,n]));
  

// Build a stable palette allocation for org keys present in this dataset (no per-org hardcoding)
const orgKeysPresent = new Set();
for (const n of nodes){
  const k = nodeOrgKey(n);
  if (k && k !== "__nogroup__") orgKeysPresent.add(k);
  if (isSensorVehicleNode(n)){
    const vehEpc = findVehicleEpcForNode(n);
    const vk = vehEpc ? vehicleOwnerOrgKey(vehEpc) : null;
    if (vk) orgKeysPresent.add(vk);
  }
}
ensureOrgColors(Array.from(orgKeysPresent));

const links = (data.links||[]).filter(e=>{
    const u=byId.get(e.source), v=byId.get(e.target);
    return u && v && new Date(u.eventTime)<=new Date(v.eventTime);
  });

  current.nodes=nodes;
  current.links=links;
  current.custodyLinks=Array.isArray(data.custodyLinks) ? data.custodyLinks : [];
  current.byId=byId;
  current.masterData=md;
  current.coverage=data.coverage || null;
  current.indices=data.indices || null;
  current.timeEvaluation=data.timeEvaluation || null;
  current.lifecycleInsights=data.lifecycleInsights || null;
  current.planningProfile=data.planningProfile || null;
  current.emissionsEvaluation=data.emissionsEvaluation || null;
  current.schemaVersion=data.schemaVersion || null;

  /* Emissions (optional) */
  {
  // Parse only what came in with *this* data payload
  const parsed = parseEmissions(data || {});
  emissionsByOrg       = parsed.byOrg;
  emissionsUnit        = parsed.unit;
  emissionsSeedTotals  = parsed.seedTotals;
  emissionsEvaluation  = parsed.evaluation;

  // Cache exactly what the current dataset has (or null)
  current.emissionsData = data?.emissions ?? null;
  }

  const suppliedLL = Array.isArray(data.lineageLinks) ? data.lineageLinks : [];
  const lineageDataRaw = suppliedLL.map(ll => ({...ll, u: byId.get(ll.source), v: byId.get(ll.target)}))
                                   .filter(x=>x.u && x.v);
  current.lineageLinks = suppliedLL;

  current.layout=baseLayout(nodes, svg.node().clientWidth, svg.node().clientHeight);
  current.parentArcs = spreadIndex > 0
    ? applyParentArcLayout(nodes, { strength:SPREAD_LEVELS[spreadIndex].strength, height:current.layout.height })
    : [];
  usePositions(nodes, spreadMode);

  const axis=d3.axisBottom(current.layout.x).ticks(8).tickSizeOuter(0);
  gAxis.attr("transform",`translate(0, ${svg.node().clientHeight - current.layout.margin.bottom})`).call(axis);
  renderParentArcBackdrops();
  updateTimelinePresentation();

  const edgeSel=gEdges.selectAll("path.edge").data(links, d=>d.source+"->"+d.target);
  edgeSel.exit().remove();
  const edgeMerged=edgeSel.enter().append("path").attr("class","edge").attr("marker-end","url(#arrow)")
    .style("stroke-dasharray", lineageDashed ? "6 6" : null)
    .merge(edgeSel);
  (layoutTransition ? edgeMerged.transition(layoutTransition) : edgeMerged)
    .attr("d", d=> bezierPath(byId.get(d.source), byId.get(d.target)));

  const linSel=gLineage.selectAll("path.lineage-edge")
    .data(lineageDataRaw, d=>`${d.source}->${d.target}|${d.role}|${d.epc}`);
  linSel.exit().remove();
  const linMerged=linSel.enter().append("path")
    .attr("class", d=>`lineage-edge ${d.role==="xform-input"?"input":"output"}`)
    .attr("marker-end","url(#arrow)")
    .merge(linSel)
    .classed("lineage-hidden", !showLineage);
  linMerged.raise();
  (layoutTransition ? linMerged.transition(layoutTransition) : linMerged)
    .attr("d", d=> bezierPath(d.u, d.v));

  const nodeSel=gNodes.selectAll("g.node").data(nodes, d=>d.id);
  nodeSel.exit().remove();
  const nodeEnter=nodeSel.enter().append("g").attr("class","node")
    .call(d3.drag()
      .on("start",(event,d)=>{
        d3.select(event.sourceEvent.target).style("cursor","grabbing");
        const cx = +d3.select(d._circle).attr("cx");
        const cy = +d3.select(d._circle).attr("cy");
        d.fx = cx; d.fy = cy;
        const [wx0, wy0] = pointerToWorld(event.sourceEvent);
        d._grab = { dx: cx - wx0, dy: cy - wy0 };

        const nodeGroupKey = nodeOrgKey(d);
        const selected = !!selectedGroupKey && nodeGroupKey === selectedGroupKey;
        if(selected){
          applyGroupSelectionState();
          const starts = new Map();
          getNodesForSelectedGroup().forEach(n => {
            const ncx = Number.isFinite(n.fx) ? n.fx : +d3.select(n._circle).attr("cx");
            const ncy = Number.isFinite(n.fy) ? n.fy : +d3.select(n._circle).attr("cy");
            n.fx = ncx;
            n.fy = ncy;
            starts.set(n.id, { fx: ncx, fy: ncy });
          });
          d._groupDrag = { wx0, wy0, starts, key: selectedGroupKey };
        } else {
          d._groupDrag = null;
        }
      })
      .on("drag",(event,d)=>{
        if(d._groupDrag){
          const [wx, wy] = pointerToWorld(event.sourceEvent);
          const dx = wx - d._groupDrag.wx0;
          const dy = wy - d._groupDrag.wy0;
          d._groupDrag.starts.forEach((st, id)=>{
            const n = current.byId.get(id);
            n.fx = st.fx + dx;
            n.fy = st.fy + dy;
            syncNodeVisualPosition(n);
          });
        } else {
          const [wx, wy] = pointerToWorld(event.sourceEvent);
          d.fx = wx + d._grab.dx;
          d.fy = wy + d._grab.dy;
          syncNodeVisualPosition(d);
        }
        gEdges.selectAll("path.edge")
          .attr("d", e => bezierPath(current.byId.get(e.source), current.byId.get(e.target)));
        gLineage.selectAll("path.lineage-edge")
          .attr("d", e => bezierPath(current.byId.get(e.source), current.byId.get(e.target)));
      })
      .on("end",(event,d)=>{
        const movedWholeGroup=!!d._groupDrag;
        const movedGroupKey = d._groupDrag?.key || nodeOrgKey(d);
        d3.select(event.sourceEvent.target).style("cursor","grab");
        d._grab = null;
        d._groupDrag = null;
        if (movedGroupKey){
          hideChronologyRailForGroup(movedGroupKey,movedWholeGroup?null:nodeIdForLayout(d));
          refreshParentArcFromCurrentPositions(movedGroupKey,current.nodes.filter(n=>nodeOrgKey(n)===movedGroupKey));
        }
      })
    )
    .on("dblclick",(event,d)=>{
      delete d.fx; delete d.fy;
      const cx = spreadMode ? (d.x_spread ?? d.x) : d.x;
      const cy = spreadMode ? (d.y_spread ?? d.y) : d.y;
      d3.select(d._circle).attr("cx", cx).attr("cy", cy);
      d3.select(d._label).attr("x", cx+(d._labelDx ?? 12)).attr("y", cy+(d._labelDy ?? 0));
      const b = d._badge; if (b) d3.select(b).attr("x", cx).attr("y", cy);
      const tb = d._timeBadge; if (tb) d3.select(tb).attr("x", cx).attr("y", cy);
      const eb = d._emissionsBadge; if (eb) d3.select(eb).attr("x", cx + 9).attr("y", cy - 9);
      gEdges.selectAll("path.edge")
        .attr("d", e=>bezierPath(current.byId.get(e.source), current.byId.get(e.target)));
      gLineage.selectAll("path.lineage-edge")
        .attr("d", e=>bezierPath(current.byId.get(e.source), current.byId.get(e.target)));
      const groupKey=nodeOrgKey(d);
      if(groupKey) refreshParentArcFromCurrentPositions(groupKey,current.nodes.filter(n=>nodeOrgKey(n)===groupKey));
      updateTimeCallout();
    })
    .on("click",(event,d)=>{
      clearLifecycleInsightFocus(false);
      setSelectedEventNode(d);
      if (sidePaneMode === "event") renderSidePanel(current.nodes);
      handleLineageFocus(d);
    });

  nodeEnter.append("circle")
    .attr("r", parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node-radius')))
    .each(function(d){ d._circle=this; });

  nodeEnter.append("text")
    .attr("class","badge")
    .text("T")
    .style("display","none")
    .each(function(d){ d._badge=this; });

  nodeEnter.append("text")
    .attr("class","time-badge hidden")
    .attr("text-anchor","middle")
    .attr("dy","0.35em")
    .text("")
    .each(function(d){ d._timeBadge=this; });

  nodeEnter.append("text")
    .attr("class","emissions-badge hidden")
    .text("")
    .each(function(d){ d._emissionsBadge=this; });

  nodeEnter.append("text")
    .attr("dy","0").attr("text-anchor",d=>d._labelAnchor ?? "start")
    .text(d=> labelForNode(d))
    .each(function(d){ d._label=this; });

  const nodesAll=nodeEnter.merge(nodeSel);

  const baseR = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node-radius')) || 8;

  const circleNodes=nodesAll.select("circle")
    .attr("fill", d=> colorForNode(d))
    .attr("stroke", d=> isSensorVehicleNode(d) ? "#ef4444" : "#ffffff")
    .attr("stroke-width", d=> isSensorVehicleNode(d) ? 3 : 2)
    .attr("r", d=> isSensorVehicleNode(d) ? baseR + 3 : baseR);
  (layoutTransition ? circleNodes.transition(layoutTransition) : circleNodes)
    .attr("cx", d=> d.fx ?? (spreadMode ? (d.x_spread ?? d.x) : d.x))
    .attr("cy", d=> d.fy ?? (spreadMode ? (d.y_spread ?? d.y) : d.y));

  const badgeNodes=nodesAll.select("text.badge")
    .style("display", d=> isSensorVehicleNode(d) ? "block" : "none");
  (layoutTransition ? badgeNodes.transition(layoutTransition) : badgeNodes)
    .attr("x", d=> d.fx ?? (spreadMode ? (d.x_spread ?? d.x) : d.x))
    .attr("y", d=> d.fy ?? (spreadMode ? (d.y_spread ?? d.y) : d.y));

  const timeBadgeNodes=nodesAll.select("text.time-badge")
    .text(d => {
      if (rendererMode !== "time") return "";
      const cls = classifyNodeTime(d);
      if (cls === "va") return "+";
      if (cls === "nva") return "−";
      return "";
    })
    .attr("class", d => {
      if (rendererMode !== "time") return "time-badge hidden";
      const cls = classifyNodeTime(d);
      return cls === "va" || cls === "nva" ? "time-badge" : "time-badge hidden";
    });
  (layoutTransition ? timeBadgeNodes.transition(layoutTransition) : timeBadgeNodes)
    .attr("x", d=> d.fx ?? (spreadMode ? (d.x_spread ?? d.x) : d.x))
    .attr("y", d=> d.fy ?? (spreadMode ? (d.y_spread ?? d.y) : d.y));

  const emissionsBadgeNodes=nodesAll.select("text.emissions-badge")
    .text(d => rendererMode === "sustainability" ? emissionsBadgeText(d) : "")
    .attr("class", d => rendererMode === "sustainability" && emissionsBadgeText(d) ? "emissions-badge" : "emissions-badge hidden")
    .attr("aria-label", d => {
      if (rendererMode !== "sustainability") return null;
      const badge = emissionsBadgeText(d);
      return badge === "C" ? "Declared PCF checkpoint" : badge === "L" ? "Logistics contribution" : badge === "C+L" ? "Declared PCF checkpoint and logistics contribution" : null;
    });
  (layoutTransition ? emissionsBadgeNodes.transition(layoutTransition) : emissionsBadgeNodes)
    .attr("x", d=> (d.fx ?? (spreadMode ? (d.x_spread ?? d.x) : d.x)) + 9)
    .attr("y", d=> (d.fy ?? (spreadMode ? (d.y_spread ?? d.y) : d.y)) - 9);

  const labelNodes=nodesAll.select("text:not(.badge):not(.time-badge):not(.emissions-badge)")
    .text(d => labelForNode(d));
  (layoutTransition ? labelNodes.transition(layoutTransition) : labelNodes)
    .attr("x", d=> (d.fx ?? (spreadMode ? (d.x_spread ?? d.x) : d.x)) + (d._labelDx ?? 12))
    .attr("y", d=> (d.fy ?? (spreadMode ? (d.y_spread ?? d.y) : d.y)) + (d._labelDy ?? 0))
    .attr("text-anchor",d=>d._labelAnchor ?? "start");

  gNodes.selectAll("g.node")
    .classed("group-selected", n=> selectedGroupSet.has(n.id))
    .classed("va", d => rendererMode === "time" && classifyNodeTime(d) === "va")
    .classed("nva", d => rendererMode === "time" && classifyNodeTime(d) === "nva")
    .classed("unknownva", d => rendererMode === "time" && classifyNodeTime(d) === "unknown");

  timeByOrg = buildTimeByOrg(nodes);
  renderSidePanel(nodes);
  applyGroupSelectionState();
  updateTimeCallout();

  if(errs.length){
    setBanner("Validation failed: "+errs[0], false);
  }else{
    const contract = data.schemaVersion || "legacy D3";
    const profileLabel=data.planningProfile?.file ? ` · profile: ${data.planningProfile.file}` : "";
    setBanner(`Loaded OK — ${contract}${profileLabel} · lineage links: ${lineageDataRaw.length}`, true);
  }

  applyShipRecvHiding();

  /* Render mode-specific ribbon + legend details */
  renderKpiBar();
  if (rendererMode === "sustainability") renderTempStrip();

  /* After ribbon content changes, sync its height for layout */
  syncRibbonHeight();
  return errs;
}

/* Lineage focus/highlight */
let activeT=null;
function handleLineageFocus(node){
  if(node?.type!=="TransformationEvent"){ clearLineageFocus(); return; }
  activeT = node.id || node.eventId;

  const lin = gLineage.selectAll("path.lineage-edge");
  lin.classed("active-lineage", false).classed("faded", true);
  gNodes.selectAll("g.node").classed("active-node", false);

  const inputs = current.lineageLinks.filter(ll => ll.role==="xform-input" && ll.target===activeT);
  const outputs= current.lineageLinks.filter(ll => ll.role==="xform-output" && ll.source===activeT);
  const ids = new Set([activeT]);
  inputs.forEach(ll=>{ ids.add(ll.source); });
  outputs.forEach(ll=>{ ids.add(ll.target); });

  lin.filter(d => (d.role==="xform-input" && d.target===activeT) || (d.role==="xform-output" && d.source===activeT))
     .classed("active-lineage", true).classed("faded", false);

  gNodes.selectAll("g.node").classed("active-node", n=> ids.has(n.id));
}
function clearLineageFocus(){
  activeT=null;
  gLineage.selectAll("path.lineage-edge").classed("active-lineage", false).classed("faded", false);
  gNodes.selectAll("g.node").classed("active-node", false);
}

});

/* NEW: Hover panel toggle */
document.getElementById("toggleEventTooltip").addEventListener("click", () => {
  sidePaneMode = sidePaneMode === "legend" ? "event" : "legend";
  hideTooltip();
  renderSidePanel(current.nodes);
  document.getElementById("toggleEventTooltip").textContent =
    sidePaneMode === "legend" ? "Show Event Data" : "Show Legend";
});

document.getElementById("toggleMode").addEventListener("click", () => {
  rendererMode = rendererMode === "sustainability" ? "time" : "sustainability";
  document.getElementById("toggleMode").textContent = rendererMode === "sustainability" ? "Mode: Sustainability" : "Mode: Time";
  timeByOrg = buildTimeByOrg(current.nodes);
  renderSidePanel(current.nodes);
  applyGroupSelectionState();
  renderKpiBar();
  gNodes.selectAll("g.node")
    .classed("va", d => rendererMode === "time" && classifyNodeTime(d) === "va")
    .classed("nva", d => rendererMode === "time" && classifyNodeTime(d) === "nva")
    .classed("unknownva", d => rendererMode === "time" && classifyNodeTime(d) === "unknown");

  gNodes.selectAll("text.time-badge")
    .text(d => {
      if (rendererMode !== "time") return "";
      const cls = classifyNodeTime(d);
      if (cls === "va") return "+";
      if (cls === "nva") return "−";
      return "";
    })
    .attr("class", d => {
      if (rendererMode !== "time") return "time-badge hidden";
      const cls = classifyNodeTime(d);
      return cls === "va" || cls === "nva" ? "time-badge" : "time-badge hidden";
    })
    .attr("x", d => Number.isFinite(d.fx) ? d.fx : (spreadMode ? (d.x_spread ?? d.x) : d.x))
    .attr("y", d => Number.isFinite(d.fy) ? d.fy : (spreadMode ? (d.y_spread ?? d.y) : d.y));

  gNodes.selectAll("text.emissions-badge")
    .text(d => rendererMode === "sustainability" ? emissionsBadgeText(d) : "")
    .attr("class", d => rendererMode === "sustainability" && emissionsBadgeText(d) ? "emissions-badge" : "emissions-badge hidden")
    .attr("aria-label", d => {
      if (rendererMode !== "sustainability") return null;
      const badge = emissionsBadgeText(d);
      return badge === "C" ? "Declared PCF checkpoint" : badge === "L" ? "Logistics contribution" : badge === "C+L" ? "Declared PCF checkpoint and logistics contribution" : null;
    });

  if (rendererMode === "sustainability") renderTempStrip();
  updateTimelinePresentation();
  updateSpreadButtonLabel();
});

document.getElementById("saveLayout").addEventListener("click", () => {
  saveLayoutToLocFile();
});

document.getElementById("restoreLayout").addEventListener("click", () => {
  document.getElementById("layoutInput").value = "";
  document.getElementById("layoutInput").click();
});

document.getElementById("layoutInput").addEventListener("change", async (e) => {
  const f = e.target.files?.[0];
  if(!f) return;
  await handleRestoreLayoutFile(f);
});

/* Update ribbon height on resize (only if visible) */
window.addEventListener("resize", () => { if (showRibbon) syncRibbonHeight(); });

/* -------------------- File loader -------------------- */
document.getElementById("fileInput").addEventListener("change", async (e)=>{
  const f = e.target.files?.[0];
  if(!f) return;
  try{
    const txt = await f.text();
    const json = JSON.parse(txt);
    currentSourceFileName = f.name || null;
    legendOrder = null;
    timelineOverride = null;
    spreadIndex = 0;
    spreadMode = false;
    selectedEventNodeId = null;
    localGroupSpread.clear();
    localGroupOriginalPositions.clear();
    dirtyChronologyArcs.clear();
    selectedGroupKey = null;
    selectedGroupSet = new Set();
    const validationErrors=render(json);
    updateSpreadButtonLabel();
    if(!validationErrors.length){
      const profileLabel=json.planningProfile?.file ? ` · bound profile: ${json.planningProfile.file}` : "";
      setBanner(`Loaded JSON: ${currentSourceFileName}${profileLabel}`, true);
    }
  }catch(err){
    setBanner("Failed to load JSON: " + (err?.message||err), false); console.error(err);
  }
});

/* -------------------- Initial state -------------------- */
setBanner("Load a v2.2.15-compliant JSON to render (File ▶︎ choose JSON). Lineage links are ON by default.", true);
/* Initialize ribbon height based on current content */
requestAnimationFrame(syncRibbonHeight);
updateSpreadButtonLabel();
</script>
</body>
</html>
